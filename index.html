<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F9F5F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141213" media="(prefers-color-scheme: dark)">
<title>Favas Contadas</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&icon_names=add,bookmark,calendar_month,check,close,coffee,content_copy,delete,dinner_dining,download,info,kitchen,lock,lock_open,lunch_dining,menu_book,nutrition,open_in_new,refresh,remove,scale,search,share,shopping_basket,takeout_dining,track_changes,tune,upload,warning&display=block">
<style>
/* Layout: app Android (Material 3) — barra de topo, conteúdo numa coluna com listas agrupadas, barra de navegação em baixo, folhas que sobem do fundo */
:root{
  --bg:#F9F5F6; --c1:#FFFFFF; --c2:#F0E9EC; --ink:#1E1B1C; --muted:#5E5759; --line:#E7DFE2;
  --accent:#3F6D12; --on-accent:#FFFFFF; --accent-soft:#F5DCE8; --on-accent-soft:#4D1D36;
  --ok:#3F6D12; --ok-soft:#E2F0D0; --warn:#8A560A; --warn-soft:#F8E6C8; --bad:#B3261E; --on-bad:#FFFFFF;
  --mc:#B67812; --mf:#2F7488;
  --press:rgb(30 27 28 / .09); --inverse:#332F30; --on-inverse:#F6EFF0; --inverse-accent:#AFD67E;
  --display:"Bricolage Grotesque", system-ui, sans-serif;
  --body:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141213; --c1:#211D1F; --c2:#2C2729; --ink:#ECE0E4; --muted:#B9ADB2; --line:#3A3337;
  --accent:#AFD67E; --on-accent:#1E3600; --accent-soft:#4E2B3E; --on-accent-soft:#FBD9E9;
  --ok:#AFD67E; --ok-soft:#263A18; --warn:#E8B45C; --warn-soft:#3F2F12; --bad:#F2B8B5; --on-bad:#601410;
  --mc:#E4B456; --mf:#79BDD0;
  --press:rgb(236 224 226 / .1); --inverse:#ECE0E4; --on-inverse:#332F30; --inverse-accent:#3F6D12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141213; --c1:#211D1F; --c2:#2C2729; --ink:#ECE0E4; --muted:#B9ADB2; --line:#3A3337;
  --accent:#AFD67E; --on-accent:#1E3600; --accent-soft:#4E2B3E; --on-accent-soft:#FBD9E9;
  --ok:#AFD67E; --ok-soft:#263A18; --warn:#E8B45C; --warn-soft:#3F2F12; --bad:#F2B8B5; --on-bad:#601410;
  --mc:#E4B456; --mf:#79BDD0;
  --press:rgb(236 224 226 / .1); --inverse:#ECE0E4; --on-inverse:#332F30; --inverse-accent:#3F6D12; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;color-scheme:light}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);-webkit-tap-highlight-color:transparent;padding-bottom:calc(80px + env(safe-area-inset-bottom,0px))}
button,input,select,label{font:inherit;color:inherit}
button,label{cursor:pointer;-webkit-user-select:none;user-select:none}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.ms{font-family:"Material Symbols Rounded";font-weight:normal;font-style:normal;font-size:24px;line-height:1;display:inline-block;white-space:nowrap;direction:ltr;font-feature-settings:"liga";font-variation-settings:"FILL" 0,"wght" 400,"GRAD" 0,"opsz" 24;flex:none;overflow:hidden;width:1em}
.ms.fill{font-variation-settings:"FILL" 1,"wght" 400,"GRAD" 0,"opsz" 24}
.ms.sm{font-size:18px}
/* camada de toque: dá ao Android o retorno visual que espera ao carregar */
.tap:active,.ibtn:active,.btn:active,.chip:active,.segb button:active{background-image:linear-gradient(var(--press),var(--press))}

/* barra de topo */
.appbar{position:sticky;top:0;z-index:5;background:var(--bg);padding-top:env(safe-area-inset-top,0px);transition:background-color .2s}
.appbar.scrolled{background:var(--c2)}
.appbar .in{max-width:640px;margin:0 auto;height:64px;display:flex;align-items:center;gap:4px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
.appbar h1{flex:1;margin:0;font:700 24px/1.2 var(--display);letter-spacing:-.01em}
.appbar .sub{font-size:13px;color:var(--muted)}
.ibtn{width:48px;height:48px;border:0;background:none;border-radius:50%;display:grid;place-items:center;flex:none}

main{max-width:640px;margin:0 auto;padding-block:4px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}

/* barra de navegação */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--c2);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));height:80px}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:500;color:var(--muted);padding:0}
nav.tabs .ind{width:56px;height:32px;border-radius:16px;display:grid;place-items:center;position:relative;transition:background-color .2s}
nav.tabs button:active .ind{background-image:linear-gradient(var(--press),var(--press))}
nav.tabs [aria-current] .ind{background-color:var(--accent-soft);color:var(--on-accent-soft)}
nav.tabs [aria-current]{color:var(--ink);font-weight:700}
nav.tabs .badge{position:absolute;top:-2px;left:32px;min-width:16px;height:16px;border-radius:8px;background:var(--bad);color:var(--on-bad);font-size:11px;font-weight:700;line-height:16px;padding:0 4px;text-align:center}

/* listas agrupadas */
.sec{font-size:14px;font-weight:600;color:var(--accent);margin:10px 4px -4px}
.box{background:var(--c1);border-radius:20px;overflow:hidden}
.box.pad{padding:16px;display:flex;flex-direction:column;gap:12px}
.li{display:flex;align-items:center;gap:16px;min-height:56px;padding:8px 16px;width:100%;border:0;background:none;text-align:left}
.li+.li{box-shadow:inset 0 1px var(--line)}
.li.split{padding:0 8px 0 0;gap:4px}
.li .main{display:flex;align-items:center;gap:16px;flex:1;min-width:0;min-height:56px;padding:10px 8px 10px 16px;border:0;background:none;text-align:left;border-radius:0}
.tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.t1{font-size:16px;line-height:1.3}
.t2{font-size:14px;color:var(--muted);line-height:1.35}
.ov{font-size:12px;font-weight:600;letter-spacing:.03em;color:var(--accent)}
.av{width:40px;height:40px;border-radius:50%;background:var(--accent-soft);color:var(--on-accent-soft);display:grid;place-items:center;flex:none}
.done .t1{text-decoration:line-through;color:var(--muted)}
.done .av{background:var(--c2);color:var(--muted)}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:0 14px;font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:transparent;color:var(--on-accent-soft);padding-left:8px}
.chip.small{height:32px;padding:0 12px;font-size:13px}
.chip.small[aria-pressed="true"]{background:var(--warn-soft);color:var(--warn);padding-left:12px}
.tag{display:inline-flex;align-items:center;gap:4px;height:24px;border-radius:6px;padding:0 8px;font-size:12px;font-weight:600;white-space:nowrap;flex:none}
.tag.hi{background:var(--ok-soft);color:var(--ok)}.tag.md{background:var(--warn-soft);color:var(--warn)}.tag.lo{background:var(--c2);color:var(--muted)}

/* botões */
.btn{height:40px;border-radius:20px;padding:0 24px;border:0;font-size:14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--accent-soft);color:var(--on-accent-soft)}
.btn.fill{background:var(--accent);color:var(--on-accent)}
.btn.text{background:none;color:var(--accent);padding:0 12px}
.btn.out{background:none;border:1px solid var(--line);color:var(--accent)}
.btn.wide{width:100%;height:48px;border-radius:24px;font-size:15px}
.btn .ms{font-size:20px}
.btn:disabled{opacity:.45}
.li.sel{background:var(--accent-soft);color:var(--on-accent-soft)}
.li.sel .t2{color:inherit}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow .btn{flex:1}

/* pesquisa e campos */
.search{display:flex;align-items:center;gap:12px;height:56px;border-radius:28px;background:var(--c2);padding:0 4px 0 16px;flex:none}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:16px;height:100%}
.search input::placeholder{color:var(--muted)}
.search:focus-within{box-shadow:inset 0 0 0 2px var(--accent)}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:2px;background:var(--c2);border-radius:12px 12px 0 0;box-shadow:inset 0 -1px var(--muted);padding:8px 16px 8px;min-width:0}
.field span{font-size:12px;color:var(--muted)}
.field input,.field select{border:0;background:none;font-size:18px;padding:0;outline:none;width:100%;min-width:0}
.field:focus-within{box-shadow:inset 0 -2px var(--accent)}
.field:focus-within span{color:var(--accent)}

/* resumo do dia */
.sum{padding:20px;display:flex;flex-direction:column;gap:12px}
.big{font:700 40px/1 var(--display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.big small{font:500 16px var(--body);color:var(--muted);letter-spacing:0}
.bar{height:8px;border-radius:4px;background:var(--c2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px}
.bar.over i{opacity:.55}
.mbars{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.mb{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);min-width:0}
.mb b{font-size:15px;color:var(--ink);font-weight:600}

/* 3 camadas */
.layers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px}
.lay{display:flex;justify-content:space-between;gap:8px;font-size:14px;align-items:center;min-width:0}
.dots{display:flex;gap:4px;flex:none}
.dots i{width:12px;height:12px;border-radius:50%;border:2px solid var(--ok)}
.dots i.f{background:var(--ok)}
.dots i.h{background:linear-gradient(90deg,var(--ok) 50%,transparent 50%)}

/* estado na despensa */
.st{width:24px;height:24px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;flex:none;color:var(--c1)}
.st.t{background:var(--ok);border-color:var(--ok)}
.st.p{border-color:var(--warn);background:linear-gradient(90deg,var(--warn) 50%,transparent 50%)}
.st .ms{font-size:18px;font-variation-settings:"wght" 700}
.st.sm{width:16px;height:16px;border-width:2px}
.ckb{width:48px;height:48px;border:0;background:none;border-radius:50%;display:grid;place-items:center;flex:none}
.ckb .st{width:28px;height:28px}

/* caixa de aviso */
.hint{background:var(--accent-soft);color:var(--on-accent-soft);border-radius:16px;padding:16px;display:flex;gap:12px;align-items:flex-start;font-size:14px}
.hint .tx{gap:10px}
.warn{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:12px 14px;font-size:14px;display:flex;gap:10px}
.note{font-size:13px;color:var(--muted);margin:0 4px}

/* folha inferior */
.scrim{position:fixed;inset:0;background:rgb(0 0 0 / .32);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--c1);width:100%;max-width:640px;border-radius:28px 28px 0 0;max-height:92%;overflow:auto;overscroll-behavior:contain;padding-block:0 calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
/* sem isto as caixas com overflow encolhem até zero quando a folha passa a altura máxima */
.sheet>*{flex-shrink:0}
.sheet .top{position:sticky;top:0;background:var(--c1);z-index:1;padding-bottom:4px;display:flex;flex-direction:column;gap:6px}
.handle{width:32px;height:4px;border-radius:2px;background:var(--muted);opacity:.45;margin:16px auto 8px}
.sheet h2{font:700 22px/1.2 var(--display);margin:0;text-wrap:balance}
.sheet .box{background:var(--bg)}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{height:32px;border-radius:8px;background:var(--c2);padding:0 12px;display:inline-flex;align-items:center;font-size:14px;font-variant-numeric:tabular-nums}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:24px;height:48px}
.stepper button{width:48px;height:46px;border:0;background:none;border-radius:24px;display:grid;place-items:center}
.stepper span{min-width:56px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:no-preference){
  .scrim{animation:fade .2s ease-out}
  .sheet{animation:up .3s cubic-bezier(.2,0,0,1)}
  .toast{animation:up2 .2s ease-out}
}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(100%)}}
@keyframes up2{from{transform:translateY(16px);opacity:0}}

/* segmentado e interruptor */
.segb{display:inline-flex;border:1px solid var(--muted);border-radius:20px;overflow:hidden;height:40px;flex:none}
.segb button{border:0;background:none;min-width:48px;padding:0 12px;font-weight:600;font-size:14px}
.segb button+button{border-left:1px solid var(--muted)}
.segb [aria-pressed="true"]{background-color:var(--accent-soft);color:var(--on-accent-soft)}
.sw{width:52px;height:32px;border-radius:16px;border:2px solid var(--muted);background:var(--c2);position:relative;padding:0;flex:none}
.sw::after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:var(--muted);top:6px;left:6px;transition:all .2s}
.sw[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.sw[aria-checked="true"]::after{width:24px;height:24px;top:2px;left:22px;background:var(--on-accent)}
.cbx{appearance:none;-webkit-appearance:none;width:18px;height:18px;border:2px solid var(--muted);border-radius:3px;margin:0;flex:none}
.cbx:checked{background:var(--accent);border-color:var(--accent)}

/* aviso em baixo (snackbar) */
.toast{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(92px + env(safe-area-inset-bottom,0px));max-width:600px;margin:0 auto;background:var(--inverse);color:var(--on-inverse);border-radius:8px;min-height:48px;padding:4px 8px 4px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:14px;z-index:30;box-shadow:0 4px 12px rgb(0 0 0 / .25)}
.toast button{border:0;background:none;color:var(--inverse-accent);font-weight:700;height:40px;padding:0 12px;border-radius:20px}
</style>
</head>
<body>

<header class="appbar" id="appbar"><div class="in"><h1 id="ttl">Plano</h1><span class="sub" id="sync"></span><span id="acts"></span></div></header>
<main id="app"></main>
<nav class="tabs" aria-label="Secções"><div class="in" id="tabs"></div></nav>
<div id="sheet"></div>
<div id="toast" class="toast" role="status" hidden></div>

<script src="dados.js?v=779dd7cc93"></script>
<script>
// ---------- Dados: dados.js é gerado pelo build.mjs a partir das notas do Obsidian
const F=window.DADOS.alimentos;
for(const x of Object.values(F))x.k=x.kcal;
const CATS=['Fruta e legumes','Frigorífico','Congelados','Mercearia','Frutos secos e sementes','Molhos e temperos','Outros'];
const R={};
for(const r of window.DADOS.receitas)R[r.id]=r;
// peças dos pratos montados: notas com despensa_tipo e alimentos simples com `comp`
const COMP={proteina:[],base:[],legume:[]};
for(const r of Object.values(R))for(const t of r.tipo||[])COMP[t].push({t:'r',id:r.id});
for(const [k,x] of Object.entries(F))if(x.comp)COMP[x.comp].push({t:'f',k});
const TIPO={proteina:'proteína',base:'base',legume:'legumes'};
const SLOTS={pa:'Pequeno-almoço',al:'Almoço',la:'Lanche',ja:'Jantar'};
const POOL={pa:'pa',al:'ref',la:'la',ja:'ref'};
const LAYER1=[['folhas','Folhas escuras',2],['cruc','Crucíferos',1],['cereais','Cereais integrais',3],['leg','Leguminosas',3],['nozes','Frutos secos e sementes',1],['bagas','Frutos vermelhos',1],['vegetais','Outros vegetais',2],['fruta','Outra fruta',2]];
const LAYER2=[['ferm','Fermentado',1],['omega','Linhaça, chia ou nozes',1]];

// ---------- Estado
const DEFAULT={v:2,ts:0,pantry:{},custom:{},wish:[],qty:{},ok:{},goals:{kcal:2390,p:140,c:300,f:70,mode:'g',pp:23,pf:26,lanche:true,days:3,variedade:'media'},plan:null,shop:{manual:[]}};
let S=structuredClone(DEFAULT);
const ui={tab:'plano',day:0,swapQ:'',pq:'',pf:'todos',rq:'',rf:'todas',sheet:null,cands:[],cz:{i:0,id:null,days:[],q:''}};

function lsGet(){try{return JSON.parse(localStorage.getItem('favas-contadas')||'null')}catch(e){return null}}
function lsSet(){try{localStorage.setItem('favas-contadas',JSON.stringify(S));return true}catch(e){return false}}
function merge(x){return Object.assign(structuredClone(DEFAULT),x||{},{goals:Object.assign({},DEFAULT.goals,(x||{}).goals),shop:Object.assign({manual:[]},(x||{}).shop),wish:(x&&x.wish)||[]})}
function setSync(t){document.getElementById('sync').textContent=t}
function save(){S.ts=Date.now();setSync(lsSet()?'':'não deu para guardar')}

// ---------- Cálculos
const st=k=>S.pantry[k]||'a';
const haveW=k=>({t:1,p:.7,a:0})[st(k)];
// época: fruta e legumes fora de época só entram se já os tiveres em casa
const MES=new Date().getMonth()+1;
const noMes=e=>e[0]<=e[1]?MES>=e[0]&&MES<=e[1]:MES>=e[0]||MES<=e[1];
const inSeason=k=>{const e=F[k]&&F[k].ep;return !e||noMes(e)};
// época alta: o que se vende o ano todo mas está na altura da produção nacional
const inPeak=k=>{const e=F[k]&&(F[k].ep||F[k].top);return !!e&&noMes(e)};
const available=k=>inSeason(k)||st(k)!=='a';
const Z=()=>({kcal:0,p:0,c:0,f:0});
function addFood(acc,k,g){const x=F[k];if(!x)return acc;acc.kcal+=x.k*g/100;acc.p+=x.p*g/100;acc.c+=x.c*g/100;acc.f+=x.f*g/100;return acc}
const _ps={};
function perServing(r){if(_ps[r.id])return _ps[r.id];const a=Z();for(const [k,g] of r.ing)addFood(a,k,g/r.sv);return _ps[r.id]=a}
const shortName=k=>F[k].n.replace(/\s*\(.*?\)/g,'').split(' / ')[0];
// uma refeição é uma receita {r,m} ou um prato montado {parts:[{t:'r',id,m}|{t:'f',k,g}], m}
function partIngs(p,f=1){if(p.t==='f')return [{k:p.k,g:p.g*f}];const r=R[p.id];return r?r.ing.map(([k,g])=>({k,g:g/r.sv*p.m*f})):[]}
function mealIngs(m){if(!m)return [];if(m.parts)return m.parts.flatMap(p=>partIngs(p,m.m));const r=R[m.r];return r?r.ing.map(([k,g])=>({k,g:g/r.sv*m.m})):[]}
const partName=p=>p.t==='f'?shortName(p.k):R[p.id].n;
const mealName=m=>m.parts?m.parts.map(partName).join(' + '):R[m.r].n;
const mealKey=m=>m.snack?'s:'+m.snack:m.parts?'c:'+(m.parts[0].t==='f'?m.parts[0].k:m.parts[0].id):m.r;
const validMeal=m=>m&&(m.parts?m.parts.every(p=>p.t==='f'?F[p.k]:R[p.id]):R[m.r]);
const mainKeys=ings=>{const s=new Set();for(const {k,g} of ings)if(g>=3)s.add(k);return [...s]};
const haveQ=(k,g)=>{const q=S.qty[k];return q!=null&&st(k)!=='a'&&q<g*.8?.4:haveW(k)};
function ingCoverage(ings){const t={};for(const {k,g} of ings)if(g>=3)t[k]=(t[k]||0)+g;const ks=Object.keys(t);return ks.length?ks.reduce((s,k)=>s+haveQ(k,t[k]),0)/ks.length:1}
// o que não chega nesta refeição, nos itens com quantidade conhecida
const mealShort=m=>{if(m.sobra)return [];const t={};for(const {k,g} of mealIngs(m))t[k]=(t[k]||0)+g;return Object.entries(t).filter(([k,g])=>S.qty[k]!=null&&st(k)!=='a'&&S.qty[k]<g*.95)};
const ingCount=ings=>{const ks=mainKeys(ings);return [ks.filter(k=>st(k)!=='a').length,ks.length]};
const recIngs=r=>r.ing.map(([k,g])=>({k,g:g/r.sv}));
const coverage=r=>ingCoverage(recIngs(r));
const mealMiss=m=>m.sobra?[]:mainKeys(mealIngs(m)).filter(k=>st(k)==='a');
function layersOf(ings){
  const L={};for(const [g] of LAYER1)L[g]=0;L.ferm=0;L.omega=0;L.vc=false;L.ac=false;
  for(const {k,g} of ings){const x=F[k];if(!x)continue;
    if(x.g1)L[x.g1]+=g/x.s1; if(x.o)L.omega+=g/x.o; if(x.fe)L.ferm+=g/x.fe;
    if(x.vc&&g>=5)L.vc=true; if(x.ac&&g>=3)L.ac=true;}
  return L;
}
function macrosOf(ings){const a=Z();for(const {k,g} of ings)addFood(a,k,g);return a}
function dayIngs(d){const day=S.plan.days[d];return day.meals.flatMap(mealIngs).concat(day.extras.map(e=>({k:e.k,g:e.g})))}
function activeSlots(){return S.goals.lanche?[['pa',.25],['al',.35],['la',.12],['ja',.28]]:[['pa',.28],['al',.38],['ja',.34]]}
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const q4=x=>Math.round(x*4)/4;
// pen: castigo por repetir nos últimos dias (negativo = prefere repetir); win/winLa: dias que conta; sob: máx. de sobras [refeições, outros]; ext: até quantos dias
const VAR={pouca:{pen:1.5,win:2,winLa:2,sob:[3,4],ext:[4,5]},media:{pen:2.5,win:3,winLa:5,sob:[2,3],ext:[3,4]},muita:{pen:4,win:5,winLa:6,sob:[1,1],ext:[2,2]}};
const V=()=>VAR[S.goals.variedade]||VAR.media;
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
function fitMult(r,kcalT){return clamp(q4(kcalT/Math.max(perServing(r).kcal,1)),.5,2.5)}

function scoreIngs(ings,share,accL,key,sv,used,rand,bonus=0){
  const G=S.goals,M=macrosOf(ings),T=x=>G[x]*share;
  const e=Math.abs(M.kcal-T('kcal'))/T('kcal')+1.5*Math.abs(M.p-T('p'))/T('p')+Math.abs(M.c-T('c'))/T('c')+.7*Math.abs(M.f-T('f'))/T('f');
  const L=layersOf(ings);let gain=0;
  for(const [g,,t] of [...LAYER1,...LAYER2])gain+=Math.min(L[g],Math.max(0,t-accL[g]))/t;
  // ingredientes fora de época que não estão em casa: a receita fica para trás
  let pen=1.5*mainKeys(ings).filter(k=>!available(k)).length-.15*mainKeys(ings).filter(inPeak).length;if(used.today.has(key))pen+=10;// as sobras já repetem a receita; voltar a cozinhá-la na mesma semana conta como repetição
  if(used.recent.has(key))pen+=V().pen;
  return 5*ingCoverage(ings)-2*e+1.2*gain-pen+rand*.9+bonus;
}
// prato montado: a proteína acerta a proteína, a base completa as calorias, 2 legumes tapam o que falta nas camadas
const unitPart=p=>p.t==='f'?{t:'f',k:p.k,g:F[p.k].cp}:{t:'r',id:p.id,m:1};
const scalePart=(p,f)=>p.t==='f'?{t:'f',k:p.k,g:Math.round(F[p.k].cp*f/10)*10}:{t:'r',id:p.id,m:f};
// lanches simples, como faria um nutricionista: uma âncora (proteína ou energia) + uma peça de fruta ou legume cru
const ANCHORS=[
  ['go_cacau',[['barra_go_cacau',35]],1],['go_banana',[['barra_go_banana',35]],1],['barra_crua',[['barra_crua',35]],1],
  ['soja_choc',[['soja_choc',200]],1],['iog_prot',[['iog_proteico',150]],0],['iog_soja',[['iog_soja',125]],0],['pao_pb',[['pao',40],['pb',16]],0],
  ['tortitas_pb',[['tortitas_grao',24],['pb',16]],0],['amendoas',[['amendoas',25]],0],['nozes',[['nozes',20]],0],['leite_soja',[['leite_soja',250]],0]
].filter(([,ps])=>ps.every(([k])=>F[k]));
const SNACK_FRUIT=['maca','pera','banana','laranja','tangerina','uvas','diospiro','ameixa','bagas','cenoura'].filter(k=>F[k]);
// fruta da época tem um pequeno bónus
const seasonScore=k=>inPeak(k)?.3:0;
const unitG=k=>F[k].u?F[k].u[2]:F[k].s1||100;
function buildCombo(P,B,share,accL,avoid=new Set(),rnd=()=>0){
  const G=S.goals,Pu=unitPart(P),Bu=unitPart(B);
  const baseL=layersOf([...partIngs(Pu),...partIngs(Bu)]),vegs=[],taken={...accL};
  for(const g of ['folhas','cruc','vegetais'])taken[g]+=baseL[g];
  for(let n=0;n<2;n++){
    let best=null,bs=-1;
    for(const V of COMP.legume){if(vegs.some(v=>v.k===V.k)||!available(V.k))continue;
      const L=layersOf(partIngs(unitPart(V)));let s=.8*haveW(V.k)+(inPeak(V.k)?.4:0)+.5*rnd()-(avoid.has(V.k)?.7:0);
      for(const [g,,t] of LAYER1)s+=Math.min(L[g],Math.max(0,t-taken[g]))/t;
      if(s>bs){bs=s;best=V}}
    const v=unitPart(best);vegs.push(v);const L=layersOf(partIngs(v));for(const g in L)if(typeof L[g]==='number')taken[g]+=L[g];
  }
  const vM=macrosOf(vegs.flatMap(v=>partIngs(v))),bM=macrosOf(partIngs(Bu)),pM=macrosOf(partIngs(Pu));
  const fP=clamp(q4((G.p*share-vM.p-bM.p)/Math.max(pM.p,1)),.5,2.5);
  const fB=clamp(q4((G.kcal*share-vM.kcal-pM.kcal*fP)/Math.max(bM.kcal,1)),.5,2.5);
  return {parts:[scalePart(P,fP),scalePart(B,fB),...vegs],m:1};
}
// ---------- 30 plantas: cada planta diferente conta 1, ervas e especiarias contam ¼; óleos, açúcar e processados não contam
const PLANT_ID={tofu:'soja',tofu_sedoso:'soja',tofu_fumado:'soja',tempeh:'soja',edamame:'soja',soja_tex:'soja',leite_soja:'soja',iog_soja:'soja',iog_proteico:'soja',miso:'soja',
  pb:'amendoim',pb_po:'amendoim',amendoim:'amendoim',amendoas:'amendoa',manteiga_amendoa:'amendoa',leite_amendoa:'amendoa',tahini:'sesamo',sesamo:'sesamo',
  farinha:'trigo',massa:'trigo',pao:'trigo',baguete:'trigo',tortilha:'trigo',panko:'trigo',massa_folhada:'trigo',seitan:'trigo',farinha_sarraceno:'sarraceno',
  farinha_grao:'grao',grao:'grao',lentilhas:'lentilhas',lentilhas_vermelhas:'lentilhas',arroz:'arroz',arroz_integral:'arroz',arroz_sushi:'arroz',
  tomate:'tomate',tomate_lata:'tomate',tomate_pasta:'tomate',tomate_seco:'tomate',leite_coco:'coco',iog_coco:'coco',chucrute:'couve',azeitonas:'azeitona'};
const PLANT_NAME={soja:'Soja',amendoim:'Amendoim',amendoa:'Amêndoa',sesamo:'Sésamo',trigo:'Trigo',sarraceno:'Trigo-sarraceno',grao:'Grão-de-bico',lentilhas:'Lentilhas',
  arroz:'Arroz',tomate:'Tomate',coco:'Coco',couve:'Couve (chucrute)',azeitona:'Azeitona'};
const PLANT_QUARTER=new Set(['ervas','gengibre','cacau','alcaparras']);
const NOT_PLANT=new Set(['azeite','oleo_sesamo','oleo_coco','maple','acucar','chocolate','tamari','maionese','ketchup','mostarda','vinagre','mirin','pesto','levedura',
  'proteina','creatina','amido','barra_go_cacau','barra_go_banana','barra_crua','soja_choc','tortitas_grao','ananas']);
function plantInfo(k){
  const x=F[k];if(!x||NOT_PLANT.has(k))return null;
  const planta=PLANT_ID[k]||x.g1||PLANT_QUARTER.has(k)||['Fruta e legumes','Frutos secos e sementes','Congelados'].includes(x.cat);
  return planta?{id:PLANT_ID[k]||k,w:PLANT_QUARTER.has(k)?.25:1}:null;
}
function plantsOf(ings){const m=new Map();for(const {k,g} of ings){if(g<3)continue;const p=plantInfo(k);if(p&&!m.has(p.id))m.set(p.id,{w:p.w,k})}return m}
const plantScore=m=>[...m.values()].reduce((s,x)=>s+x.w,0);
// meta em curva: as plantas novas aparecem depressa nos primeiros dias (1 dia ≈ 11, 3 ≈ 20, 5 ≈ 25, 7 = 30)
const plantTarget=()=>Math.round(30*Math.sqrt(S.plan.days.length/7));
const plantName=(id,k)=>PLANT_NAME[id]||shortName(k);
function pickFor(d,slotIdx,excludeKey){
  const day=S.plan.days[d],[slot,share]=activeSlots()[slotIdx];
  const others=day.meals.filter((x,i)=>i!==slotIdx&&x);
  const accL=layersOf(others.flatMap(mealIngs));
  const used={today:new Set(others.map(mealKey)),recent:new Set()};
  // lanches rodam mais devagar (5 dias) para irem passando por barras, tortitas, pão…
  for(let j=Math.max(0,d-(POOL[slot]==='la'?V().winLa:V().win));j<d;j++)S.plan.days[j].meals.forEach(x=>x&&used.recent.add(mealKey(x)));
  // legumes já usados hoje ou ontem ficam para trás, para variar
  const avoid=new Set([...others,...(d>0?S.plan.days[d-1].meals:[])].flatMap(x=>x&&x.parts?x.parts.filter(p=>p.t==='f').map(p=>p.k):[]));
  const planned=new Set();S.plan.days.forEach((dd,j)=>dd.meals.forEach((x,ii)=>{if(x&&!x.parts&&!(j===d&&ii===slotIdx))planned.add(x.r)}));
  const rand=rng(S.plan.seed+d*977+slotIdx*31),out=[];
  const jaTem=plantsOf(S.plan.days.flatMap((dd,j)=>dd.meals.filter((x,ii)=>x&&!(j===d&&ii===slotIdx)).flatMap(mealIngs)));
  const falta=plantScore(jaTem)<plantTarget();
  const novas=ings=>{if(!falta)return 0;let n=0;for(const [id,x] of plantsOf(ings))if(!jaTem.has(id))n+=x.w;return Math.min(1.5,.3*n)};
  for(const r of Object.values(R)){
    if(!r.slots.includes(POOL[slot])||r.id===excludeKey)continue;
    const m=fitMult(r,S.goals.kcal*share),ings=mealIngs({r:r.id,m});
    const wish=S.wish.includes(r.id)&&!planned.has(r.id)?4:0;
    out.push({kind:'r',r,m,ings,score:scoreIngs(ings,share,accL,r.id,r.sv,used,rand(),wish+novas(ings))});
  }
  if(POOL[slot]==='ref')for(const P of COMP.proteina)for(const B of COMP.base){
    const meal=buildCombo(P,B,share,accL,avoid,rand),key=mealKey(meal);if(key===excludeKey)continue;
    const ings=mealIngs(meal);
    // as receitas têm sempre preferência: peças soltas só ganham quando nenhuma receita serve
    out.push({kind:'c',meal,ings,score:scoreIngs(ings,share,accL,key,1,used,rand(),-3.5+novas(ings))});
  }
  // produtos embalados (barras, bebida de chocolate) contam menos, para não aparecerem todos os dias
  if(POOL[slot]==='la')for(const [id,ps,proc] of ANCHORS)for(const fk of SNACK_FRUIT.filter(available))for(const n of proc?[1]:[1,1.5]){
    const key='s:'+id;if(key===excludeKey)continue;
    const meal={parts:[...ps.map(([k,g])=>({t:'f',k,g:g*n})),{t:'f',k:fk,g:unitG(fk)}],m:1,snack:id};
    const ings=mealIngs(meal);
    out.push({kind:'c',meal,ings,score:scoreIngs(ings,share,accL,key,1,used,rand(),seasonScore(fk)-(proc?.15:0)-(avoid.has(fk)?.5:0)-3.5+novas(ings))});
  }
  return out.sort((a,b)=>b.score-a.score);
}
const toMeal=(c,slot)=>c.kind==='r'?{slot,r:c.r.id,m:c.m,done:false}:{slot,...structuredClone(c.meal),done:false};

// sobras: uma receita de várias porções cozinhada hoje enche refeições dos dias seguintes
function scheduleSobras(d,i){
  const m=S.plan.days[d].meals[i];if(!m||m.parts||m.sobra)return;
  const r=R[m.r],pool=POOL[m.slot],sl=activeSlots();
  let n=Math.min(Math.floor((r.sv-m.m)/m.m+.25),pool==='ref'?V().sob[0]:V().sob[1]);
  for(let dd=d+1;dd<Math.min(S.plan.days.length,d+(pool==='ref'?V().ext[0]:V().ext[1]))&&n>0;dd++)
    sl.forEach(([s],ii)=>{if(n>0&&POOL[s]===pool&&!S.plan.days[dd].meals[ii]){S.plan.days[dd].meals[ii]={slot:s,r:m.r,m:m.m,sobra:true,from:[d,i],done:false};n--}});
}
// tira as sobras de uma refeição que mudou e volta a preencher esses lugares
function clearSobras(d,i){
  const freed=[];
  S.plan.days.forEach((day,dd)=>day.meals.forEach((x,ii)=>{if(x&&x.sobra&&x.from[0]===d&&x.from[1]===i){day.meals[ii]=null;freed.push([dd,ii])}}));
  return freed;
}
function refill(slots){for(const [dd,ii] of slots)if(!S.plan.days[dd].meals[ii])S.plan.days[dd].meals[ii]=toMeal(pickFor(dd,ii)[0],activeSlots()[ii][0])}
function replaceMeal(d,i,meal){
  const freed=clearSobras(d,i);S.plan.days[d].meals[i]=meal;scheduleSobras(d,i);refill(freed);
}
function buildDay(d){
  const day=S.plan.days[d];
  activeSlots().forEach(([slot],i)=>{if(!day.meals[i])day.meals[i]=toMeal(pickFor(d,i)[0],slot);scheduleSobras(d,i)});
}
const addDays=(iso,n)=>{const [y,mo,da]=iso.split('-').map(Number),t=new Date(y,mo-1,da+n);return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0')};
function generatePlan(persist=true){
  // refeições fixadas de hoje em diante passam para o plano novo
  const old=S.plan,keep={};
  if(old&&old.days)old.days.forEach((day,d)=>day.meals.forEach(m=>{if(m&&m.lock&&!m.sobra&&validMeal(m)){const dt=addDays(old.start,d);if(dt>=todayISO())keep[dt+'|'+m.slot]={...m}}}));
  S.plan={seed:Math.floor(Math.random()*1e9),start:todayISO(),lanche:S.goals.lanche,days:[]};
  const sl=activeSlots();
  for(let d=0;d<S.goals.days;d++)S.plan.days[d]={meals:sl.map(([s])=>keep[addDays(S.plan.start,d)+'|'+s]||null),extras:[]};
  for(let d=0;d<S.goals.days;d++)buildDay(d);
  ui.day=0;if(persist)save();
}
// sem gravar: um plano criado só para mostrar algo não deve contar como alteração
function ensurePlan(){if(!S.plan||!S.plan.days||!S.plan.days.length||S.plan.lanche!==S.goals.lanche||S.plan.days.some(d=>d.meals.some(m=>!validMeal(m))))generatePlan(false)}
function todayISO(){const t=new Date();return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0')}
function dayLabel(d){const [y,mo,da]=S.plan.start.split('-').map(Number);const t=new Date(y,mo-1,da+d);
  const wd=['dom','seg','ter','qua','qui','sex','sáb'][t.getDay()];return (d===0&&S.plan.start===todayISO()?'Hoje':wd.charAt(0).toUpperCase()+wd.slice(1))+' '+t.getDate()}
// põe uma receita da lista "quero fazer" no primeiro lugar livre que sirva (de amanhã em diante, se houver)
function placeWish(id){
  const r=R[id],sl=activeSlots(),days=S.plan.days.length;
  for(const d of [...Array(days).keys()].sort((a,b)=>(a===0)-(b===0)))
    for(let i=0;i<sl.length;i++){const m=S.plan.days[d].meals[i];
      if(r.slots.includes(POOL[sl[i][0]])&&m&&!m.lock&&!m.done&&!m.sobra&&!S.wish.includes(m.r)){
        replaceMeal(d,i,{slot:sl[i][0],r:id,m:fitMult(r,S.goals.kcal*sl[i][1]),done:false});return [d,i]}}
  return null;
}

const PROT=[['proteina',30,40],['barra_go_cacau',35,70],['tofu',126,200],['seitan',100,200],['edamame',100,200],['tempeh',88,150],['iog_proteico',150,250],['soja_tex',25,50]];
function suggestions(d){
  const ings=dayIngs(d),M=macrosOf(ings),L=layersOf(ings),out=[],G=S.goals;
  const dp=G.p-M.p;
  if(dp>12){
    const opts=PROT.map(([k,sv,cap])=>({k,g:Math.min(cap,Math.max(sv/2,Math.round(dp/(F[k].p/100)/5)*5)),w:haveW(k)})).sort((a,b)=>b.w-a.w||F[b.k].p/F[b.k].k-F[a.k].p/F[a.k].k);
    const o=opts[0];out.push({k:o.k,g:o.g,why:`faltam ${Math.round(dp)} g de proteína`});
  }
  for(const [g,label,t] of [...LAYER1,...LAYER2]){
    const miss=t-L[g];if(miss<.5)continue;
    const cands=Object.entries(F).filter(([k,x])=>available(k)&&(g==='omega'?x.o:g==='ferm'?x.fe:x.g1===g))
      .map(([k,x])=>({k,w:haveW(k),sv:g==='omega'?x.o:g==='ferm'?x.fe:x.s1})).sort((a,b)=>b.w-a.w);
    const c=cands[0];if(!c)continue;
    out.push({k:c.k,g:Math.round(c.sv*Math.max(1,Math.round(miss))),why:`${label}: ${fmtN(L[g])} de ${t}`});
  }
  return out;
}
const fmtN=x=>{const r=Math.round(x*2)/2;return String(r).replace('.',',')};
const fmtG=g=>g>=1000?(Math.round(g/100)/10+' kg').replace('.',','):(g<10?Math.round(g):Math.round(g/5)*5)+' g';
const fmtQ=(k,g)=>{const u=F[k]&&F[k].u;if(!u)return fmtG(g);const n=Math.round(g/u[2]*2)/2;return n<.5?fmtG(g):String(n).replace('.',',')+' '+(n<=1?u[0]:u[1])};
const fmtM=x=>'×'+String(x).replace('.',',');

// ---------- Objetivos: kcal e macros andam juntas (4 kcal/g proteína e hidratos, 9 kcal/g gordura)
function syncGoals(G){
  if(G.mode==='pct'){const pc=Math.max(0,100-G.pp-G.pf);G.p=Math.round(G.kcal*G.pp/400);G.f=Math.round(G.kcal*G.pf/900);G.c=Math.round(G.kcal*pc/400)}
  else{G.kcal=Math.round(4*G.p+4*G.c+9*G.f);G.pp=Math.round(400*G.p/G.kcal);G.pf=Math.round(900*G.f/G.kcal)}
}
function setGoal(k,v){
  const G=S.goals;
  if(k==='kcal'&&G.mode==='g'){const s=v/Math.max(1,4*G.p+4*G.c+9*G.f);G.p=Math.round(G.p*s);G.c=Math.round(G.c*s);G.f=Math.round(G.f*s)}
  else if(k==='pp'||k==='pf'){G[k]=clamp(v,5,90);const o=k==='pp'?'pf':'pp';if(G.pp+G.pf>95)G[o]=95-G[k]}
  else G[k]=v;
  syncGoals(G);
}

// ---------- Lista de compras
function sourceDone(m){return m.sobra&&S.plan.days[m.from[0]]?.meals[m.from[1]]?.done}
// tudo o que o plano ainda vai usar (refeições por fazer e extras)
function planUse(){
  const use={},why={};
  if(S.plan)S.plan.days.forEach(day=>{
    day.meals.forEach(m=>{if(!m||m.done||sourceDone(m))return;for(const {k,g} of mealIngs(m)){use[k]=(use[k]||0)+g;(why[k]||(why[k]=new Set())).add(m.parts?partName(m.parts[0])+' + …':R[m.r].n)}});
    day.extras.forEach(e=>{use[e.k]=(use[e.k]||0)+e.g;(why[e.k]||(why[e.k]=new Set())).add('extra')});
  });
  return {use,why};
}
function shoppingList(){
  const {use,why}=planUse(),plan=[],low=[],check=[];
  for(const [k,g] of Object.entries(use)){
    const s=st(k),q=S.qty[k],w=[...why[k]];
    if(s==='a'){plan.push({k,g,why:w});continue}
    // sabes quanto tens: só a diferença vai para as compras
    if(q!=null){if(g>q*1.05)(s==='p'?low:plan).push({k,g:g-q,why:w,short:{q,use:g}});continue}
    if(s==='p'){low.push({k,g,why:w});continue}
    // tens, mas não disseste quanto: pergunta se chega quando o plano usa uma quantidade que se nota
    const muito=F[k]&&F[k].u?g>=2*F[k].u[2]:g>=250;
    if(muito&&!(S.ok[k]&&g<=S.ok[k]*1.15))check.push({k,g,why:w});
  }
  for(const k of Object.keys(S.pantry))if(st(k)==='p'&&use[k]==null)low.push({k,g:0,why:[]});
  for(const k of Object.keys(S.custom))if(st(k)==='p'&&!low.find(x=>x.k===k))low.push({k,g:0,why:[]});
  const byCat=(a,b)=>CATS.indexOf(itemCat(a.k))-CATS.indexOf(itemCat(b.k))||itemName(a.k).localeCompare(itemName(b.k),'pt');
  return {plan:plan.sort(byCat),low:low.sort(byCat),check:check.sort((a,b)=>b.g-a.g).slice(0,8)};
}

  h+=`<div class="sec">3 camadas</div><div class="box pad"><div class="layers">${[...LAYER1,...LAYER2].map(([g,l,t])=>`<div class="lay"><span>${l}</span>${dots(L[g],t)}</div>`).join('')}</div></div>`;
  const PL=plantsOf(S.plan.days.flatMap((x,j)=>dayIngs(j))),nP=plantScore(PL),TP=plantTarget();
  const sugP=Object.keys(F).filter(k=>st(k)==='t'&&available(k)&&(()=>{const p=plantInfo(k);return p&&p.w===1&&!PL.has(p.id)})()).slice(0,6);

  if(sugs.length||day.extras.length){

    h+=day.extras.map((e,i)=>`<div class="li"><div class="tx"><span class="t1">${esc(itemName(e.k))}</span><span class="t2 num">${fmtQ(e.k,e.g)} · juntado</span></div><button class="ibtn" data-act="rmextra" data-d="${d}" data-i="${i}" aria-label="Tirar ${esc(itemName(e.k))}">${ic('close')}</button></div>`).join('');

    h+=`</div>`;
  }
  h+=`<p class="note">Plano de ${S.plan.days.length} dia${S.plan.days.length>1?'s':''}, feito com o que tens agora. Toca numa refeição para trocar, fixar, mudar a porção ou ver a receita. ${ic('refresh','sm')} refaz o plano e mantém as refeições fixadas.</p>`;
  return h;
}
function mealRow(d,i,m){

// ---------- Folhas inferiores
function renderSheet(){
  const el=document.getElementById('sheet'),s=ui.sheet;
  if(!s){el.innerHTML='';return}
  const body=s.type==='meal'?sMeal(s):s.type==='recipe'?sRecipe(s):s.type==='qty'?sQty(s):s.type==='custom'?sCustom():sCooked(s);
  const keep=el.querySelector('.sheet')?.scrollTop||0;
  el.innerHTML=`<div class="scrim" data-act="closesheet"><div class="sheet" role="dialog" aria-modal="true">${body}</div></div>`;
  if(keep)el.querySelector('.sheet').scrollTop=keep;
}
const sheetTop=(title,over)=>`<div class="top"><div class="handle"></div>${over?`<span class="ov">${over}</span>`:''}<h2>${title}</h2></div>`;
const pills=M=>`<div class="pills">${[[M.kcal,'kcal'],[M.p,'g prot.'],[M.c,'g hidr.'],[M.f,'g gord.']].map(([v,u])=>`<span class="pill">${Math.round(v)} ${u}</span>`).join('')}</div>`;
function sMeal({d,i}){
  const m=S.plan.days[d].meals[i],ings=mealIngs(m),M=macrosOf(ings),L=layersOf(ings);
  const miss=mealMiss(m).map(k=>F[k].n),curto=mealShort(m);
  const tips=[];
  if(L.leg>=.5&&!L.vc)tips.push('Junta vitamina C (limão, pimento cru, laranja) para absorver melhor o ferro.');
  if(L.leg>=.5&&!L.ac)tips.push('Um dente de alho ou um pouco de cebola ajuda a absorver o zinco.');
  ui.cands=pickFor(d,i,mealKey(m));
  const sobras=S.plan.days.flatMap((x,dd)=>x.meals.map((y,ii)=>y&&y.sobra&&y.from[0]===d&&y.from[1]===i?dayLabel(dd)+' ('+SLOTS[y.slot].toLowerCase()+')':null)).filter(Boolean);
  let h=sheetTop(esc(mealName(m)),`${SLOTS[m.slot]} · ${dayLabel(d)}${m.snack?' · lanche simples':m.parts?' · prato montado':''}`)+pills(M);
  if(m.sobra)h+=`<div class="hint">${ic('takeout_dining')}<span>Sobra do que cozinhas ${dayLabel(m.from[0]).toLowerCase()}. Não é preciso cozinhar nem comprar de novo.</span></div>`;
  if(sobras.length)h+=`<div class="hint">${ic('takeout_dining')}<span>Faz a receita inteira: o resto fica para ${esc(sobras.join(' e '))}.</span></div>`;
  if(m.parts)h+=`<div class="box">${m.parts.map(p=>p.t==='r'?`<button class="li tap" data-act="recipe" data-v="${p.id}"><span class="tx"><span class="t1">${esc(R[p.id].n)}</span><span class="t2 num">${R[p.id].tipo.map(t=>TIPO[t]).join(', ')} · ${fmtM(q4(p.m*m.m))} porção</span></span>${ic('menu_book')}</button>`:`<div class="li">${stDot(p.k)}<span class="tx"><span class="t1">${esc(F[p.k].n)}</span><span class="t2">${(F[p.k].comp?TIPO[F[p.k].comp]:'')}</span></span><span class="t2 num">${fmtQ(p.k,p.g*m.m)}</span></div>`).join('')}</div>`;
  h+=`<div class="li" style="padding:0"><span class="t1" style="flex:1">Porção</span><span class="stepper"><button data-act="m-" data-d="${d}" data-i="${i}" aria-label="Menos">${ic('remove')}</button><span>${fmtM(m.m)}</span><button data-act="m+" data-d="${d}" data-i="${i}" aria-label="Mais">${ic('add')}</button></span></div>
  ${miss.length?`<div class="warn">${ic('warning')}<span>Falta: ${esc(miss.join(', '))}</span></div>`:''}
  ${curto.length?`<div class="warn">${ic('warning')}<span>Não chega: ${curto.map(([k,g])=>esc(shortName(k).toLowerCase())+' (tens ~'+fmtQ(k,S.qty[k])+', precisa de '+fmtQ(k,g)+')').join(', ')}</span></div>`:''}
  ${tips.map(t=>`<div class="hint">${ic('info')}<span>${t}</span></div>`).join('')}
  <div class="btnrow">${m.done?`<button class="btn out" data-act="undone" data-d="${d}" data-i="${i}">Desmarcar</button>`:`<button class="btn fill" data-act="done" data-d="${d}" data-i="${i}">${ic('check')}Fiz isto</button>`}
  <button class="btn ${m.lock?'':'out'}" data-act="lock" data-d="${d}" data-i="${i}" aria-pressed="${!!m.lock}">${ic(m.lock?'lock':'lock_open',m.lock?'fill':'')}${m.lock?'Fixada':'Fixar'}</button>
  ${m.parts?'':`<button class="btn" data-act="recipe" data-v="${m.r}">${ic('menu_book')}Receita</button>`}</div>
  <div class="sec" style="margin-top:4px">Trocar por</div>
  <label class="search">${ic('search')}<input type="search" id="swapq" placeholder="Procurar receita ou componente" value="${esc(ui.swapQ)}" data-in="swapq" autocomplete="off"></label>
  <div id="swres" style="display:flex;flex-direction:column;gap:12px">${swapResults(d,i)}</div>`;
  return h;
}
function swapResults(d,i){
  const q=ui.swapQ.trim().toLowerCase();
  const name=c=>c.kind==='r'?c.r.n:mealName(c.meal);
  const idx=ui.cands.map((c,ci)=>({c,ci})).filter(({c})=>!q||name(c).toLowerCase().includes(q));
  const row=({c,ci})=>`<button class="li tap" data-act="pick" data-d="${d}" data-i="${i}" data-ci="${ci}"><span class="tx"><span class="t1">${esc(name(c))}</span><span class="t2 num">${mtxt(macrosOf(c.ings))}${c.kind==='r'?' · '+fmtM(c.m):''}</span></span>${covTagIngs(c.ings)}</button>`;
  const rs=idx.filter(x=>x.c.kind==='r').slice(0,q?20:5),cs=idx.filter(x=>x.c.kind==='c').slice(0,q?20:5);
  if(!rs.length&&!cs.length)return `<p class="note">Nada com esse nome para esta refeição.</p>`;
  return (rs.length?`<div class="sec" style="margin:0 4px -4px;color:var(--muted)">Receitas</div><div class="box">${rs.map(row).join('')}</div>`:'')+
    (cs.length?`<div class="sec" style="margin:0 4px -4px;color:var(--muted)">${POOL[S.plan.days[d].meals[i].slot]==='la'?'Lanches simples':'Pratos montados'}</div><div class="box">${cs.map(row).join('')}</div>`:'');
}
function sRecipe({id}){
  const r=R[id],ps=perServing(r),wish=S.wish.includes(id);
  const days=S.plan?S.plan.days.map((x,i)=>`<option value="${i}" ${i===ui.day?'selected':''}>${dayLabel(i)}</option>`).join('')+(S.plan.days.length>1?'<option value="all">Todos os dias</option>':''):'';
  const slots=r.slots.length?activeSlots().map(([s],i)=>({s,i,ok:r.slots.includes(POOL[s])})).sort((a,b)=>b.ok-a.ok):[];
  const url='obsidian://open?vault='+encodeURIComponent('Obsidian Vault')+'&file='+encodeURIComponent('02 - Recursos/Receitas/'+r.file);
  return sheetTop(esc(r.n),`Rende ${r.sv} ${r.sv>1?'porções':'porção'}${r.tipo?' · componente: '+r.tipo.map(t=>TIPO[t]).join(', '):''}${r.est?' · estimada':''}`)+pills(ps)+
  (r.slots.length?`<button class="btn ${wish?'':'out'}" style="align-self:flex-start" data-act="wish" data-v="${id}" aria-pressed="${wish}">${ic('bookmark',wish?'fill':'')}${wish?'Na lista “quero fazer”':'Quero fazer'}</button>`:'')+
  `${r.tipo?`<p class="note">Entra nos pratos montados do plano como ${r.tipo.map(t=>TIPO[t]).join(' e ')}.</p>`:''}
  <div class="sec" style="margin-top:0">Ingredientes por porção</div>
  <div class="box">${r.ing.map(([k,g])=>`<div class="li" style="min-height:48px">${stDot(k,'sm')}<span class="t1" style="flex:1">${esc(F[k].n)}</span><span class="t2 num">${fmtQ(k,g/r.sv)}</span></div>`).join('')}</div>
  <p class="note">${r.est?'Esta nota não tem a propriedade despensa: as quantidades foram tiradas da lista de ingredientes e podem falhar.':'Quantidades da propriedade despensa da nota.'} Sal, especiarias e água não contam.</p>
  ${slots.length&&days?`<div class="sec" style="margin-top:0">Pôr no plano (fica fixada)</div><div class="fields"><label class="field"><span>Dia</span><select id="pd">${days}</select></label><label class="field"><span>Refeição</span><select id="ps">${slots.map(({s,i,ok})=>`<option value="${i}">${SLOTS[s]}${ok?'':' (fora do habitual)'}</option>`).join('')}</select></label></div><button class="btn fill wide" data-act="toplan" data-v="${r.id}">${ic('add')}Pôr no plano</button>`:''}
  <a class="btn text" href="${url}" style="align-self:flex-start;text-decoration:none">${ic('open_in_new')}Abrir a nota no Obsidian</a>`;
}
// personalizar: escolhe a refeição, procura a receita e marca os dias do plano onde ela fica fixada
function sCustom(){
  const c=ui.cz,sl=activeSlots(),[s]=sl[c.i],r=c.id&&R[c.id];
  let h=sheetTop('Personalizar refeições','Escolhe a refeição, a receita e os dias');
  h+=`<div class="chips">${sl.map(([x],i)=>`<button class="chip" data-act="czslot" data-v="${i}" aria-pressed="${i===c.i}">${i===c.i?ic('check','sm'):ic(SLOTICON[x],'sm')}${SLOTS[x]}</button>`).join('')}</div>`;
  h+=`<div class="sec" style="margin-top:0">Receita</div>`;
  if(r)h+=`<div class="box"><div class="li sel"><span class="tx"><span class="t1">${esc(r.n)}</span><span class="t2 num">${mtxt(perServing(r))} por porção${r.slots.includes(POOL[s])?'':' · fora do habitual'}</span></span><button class="btn text" data-act="czclear">Mudar</button></div></div>`;
  else h+=`<label class="search">${ic('search')}<input type="search" id="czq" placeholder="Procurar receita ou ingrediente" value="${esc(c.q)}" data-in="czq" autocomplete="off" enterkeyhint="search"></label><div id="czres" style="display:flex;flex-direction:column;gap:12px">${customResults()}</div>`;
  const n=c.days.length,all=n===S.plan.days.length;
  h+=`<div class="sec" style="margin:0;display:flex;align-items:center"><span style="flex:1">Dias</span><button class="btn text" data-act="czall">${all?'Nenhum':'Todos'}</button></div>
  <div class="box">${S.plan.days.map((day,d)=>{const m=day.meals[c.i],on=c.days.includes(d);
    return `<button class="li tap" data-act="czday" data-d="${d}" role="checkbox" aria-checked="${on}"><span class="st ${on?'t':''}">${on?ic('check'):''}</span><span class="tx"><span class="t1">${dayLabel(d)}</span><span class="t2">${m?(m.lock?ic('lock','sm fill')+' ':'')+esc(mealName(m))+(m.done?' · feita':''):'—'}</span></span></button>`}).join('')}</div>`;
  h+=`<button class="btn fill wide" data-act="czapply" ${r&&n?'':'disabled'}>${ic('add')}${!r?'Escolhe uma receita':!n?'Escolhe os dias':'Pôr em '+(all?'todos os dias':n+' dia'+(n>1?'s':''))}</button>
  <p class="note">Fica fixada: quando refazes o plano, mantém-se. A porção ajusta-se às calorias desta refeição.</p>`;
  return h;
}
function customResults(){
  const c=ui.cz,q=c.q.trim().toLowerCase(),pool=POOL[activeSlots()[c.i][0]];
  const list=Object.values(R).filter(r=>r.slots.length&&(!q||r.n.toLowerCase().includes(q)||r.ing.some(([k])=>F[k].n.toLowerCase().includes(q))))
    .sort((a,b)=>S.wish.includes(b.id)-S.wish.includes(a.id)||coverage(b)-coverage(a)||a.n.localeCompare(b.n,'pt'));
  const row=r=>`<button class="li tap" data-act="czpick" data-v="${r.id}"><span class="tx"><span class="t1">${S.wish.includes(r.id)?ic('bookmark','sm fill')+' ':''}${esc(r.n)}</span><span class="t2 num">${mtxt(perServing(r))}</span></span>${covTag(r)}</button>`;
  const hab=list.filter(r=>r.slots.includes(pool)),out=q?list.filter(r=>!r.slots.includes(pool)):[];
  if(!hab.length&&!out.length)return `<p class="note">Nenhuma receita encontrada.</p>`;
  return (hab.length?`<div class="box">${hab.slice(0,q?40:12).map(row).join('')}</div>`:'')+(!q&&hab.length>12?`<p class="note">Mostra as 12 com mais coisas em casa. Procura para ver as outras.</p>`:'')+
    (out.length?`<div class="sec" style="margin:0 4px -4px;color:var(--muted)">Fora do habitual nesta refeição</div><div class="box">${out.slice(0,20).map(row).join('')}</div>`:'');
}
function sQty({k}){
  const x=F[k],u=x&&x.u,g=planUse().use[k]||0,q=S.qty[k];
  const opts=u?[.5,1,2,3,4,6].map(n=>n*u[2]):[100,250,500,1000];
  return sheetTop(esc(itemName(k)),'Quanto tens, mais ou menos?')+`<p class="t2" style="margin:0">${g?`O plano usa ${fmtQ(k,g)}${u?' ('+fmtG(g)+')':''}. `:''}Não é preciso pesar: escolhe o mais parecido. Quando marcas uma refeição como feita, a app desconta.</p>
  <div class="pills">${opts.map(v=>`<button class="chip" data-act="setqty" data-k="${k}" data-g="${v}" aria-pressed="${q!=null&&Math.abs(q-v)<1}">${fmtQ(k,v)}</button>`).join('')}</div>
  <label class="field"><span>Ou em gramas</span><input type="number" inputmode="numeric" id="qtyg" value="${q!=null?Math.round(q):''}"></label>
  <div class="btnrow"><button class="btn fill" data-act="setqty" data-k="${k}">Guardar</button>${q!=null?`<button class="btn out" data-act="clearqty" data-k="${k}">Não sei quanto</button>`:''}</div>`;
}
function sCooked({d,i}){
  const m=S.plan.days[d].meals[i];
  return sheetTop('O que acabou?',esc(mealName(m)))+`<p class="t2" style="margin:0">Toca no que acabou. Se ficou pouco, marca <b>Pouco</b>. Vai tudo para as compras.</p>
  <div class="box">${mainKeys(mealIngs(m)).map(pRow).join('')}</div><button class="btn fill wide" data-act="closesheet">Feito</button>`;
}
function openSheet(o){
  ui.swapQ='';
  if(!ui.sheet){try{history.pushState({tab:ui.tab,sheet:1},'')}catch(_){}}
  ui.sheet=o;render();
}
// arrastar a folha para baixo fecha-a
let drag=null;
document.addEventListener('touchstart',e=>{const sh=e.target.closest('.sheet');if(!sh||sh.scrollTop>0||e.target.closest('input,select'))return;drag={y:e.touches[0].clientY,sh,dy:0}},{passive:true});
document.addEventListener('touchmove',e=>{if(!drag)return;drag.dy=Math.max(0,e.touches[0].clientY-drag.y);drag.sh.style.transform=`translateY(${drag.dy}px)`},{passive:true});
document.addEventListener('touchend',()=>{if(!drag)return;const {sh,dy}=drag;drag=null;if(dy>100){closeSheet();return}sh.style.transition='transform .2s';sh.style.transform='';setTimeout(()=>sh.style.transition='',200)});
addEventListener('scroll',()=>document.getElementById('appbar').classList.toggle('scrolled',scrollY>4),{passive:true});

// riscar e apagar são imediatos; o aviso dá 5 s para anular
let undoSnap=null;
function undoable(msg,fn){undoSnap=JSON.stringify(S);fn();save();toast(msg,true)}
function toast(t,undo){const el=document.getElementById('toast');el.innerHTML=`<span>${esc(t)}</span>${undo?'<button data-act="undo">Anular</button>':''}`;el.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>{el.hidden=true;if(undo)undoSnap=null},undo?5000:2500)}
function closeSheet(){if(history.state&&history.state.sheet){history.back()}else{ui.sheet=null;render()}}
const slotTxt=(d,i)=>`${dayLabel(d)}, ${SLOTS[activeSlots()[i][0]].toLowerCase()}`;

// ---------- Ações
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,v=b.dataset.v,d=+b.dataset.d,i=+b.dataset.i;
  if(a==='closesheet'&&b.classList.contains('scrim')&&e.target!==b)return;
  if(a==='bought'||a==='boughtm')return;
  const day=S.plan&&S.plan.days[d];
  switch(a){
    case 'tab':if(ui.tab!==v){try{history.pushState({tab:v},'','#'+v)}catch(_){}}ui.tab=v;ui.sheet=null;window.scrollTo(0,0);break;
    case 'undo':if(undoSnap){S=merge(JSON.parse(undoSnap));undoSnap=null;save();document.getElementById('toast').hidden=true}break;
    case 'day':ui.day=+v;break;
    case 'meal':openSheet({type:'meal',d,i});return;
    case 'recipe':openSheet({type:'recipe',id:v});return;
    case 'pick':{const c=ui.cands[+b.dataset.ci],old=day.meals[i];replaceMeal(d,i,{...toMeal(c,old.slot),lock:old.lock});save();toast('Trocado por '+mealName(day.meals[i]));closeSheet();return}
    case 'm-':case 'm+':{const m=day.meals[i];m.m=a==='m-'?Math.max(.25,m.m-.25):Math.min(4,m.m+.25);
      S.plan.days.forEach(x=>x.meals.forEach(y=>{if(y&&y.sobra&&y.from[0]===d&&y.from[1]===i)y.m=m.m}));save();break}
    case 'lock':day.meals[i].lock=!day.meals[i].lock;save();toast(day.meals[i].lock?'Fixada: fica quando refazes o plano':'Já não está fixada');break;
    case 'done':{const m=day.meals[i];m.done=true;
      // desconta o que se sabe que havia; uma receita com sobras gasta a receita toda nesse dia
      if(!m.sobra){const n=1+S.plan.days.flatMap(x=>x.meals).filter(y=>y&&y.sobra&&y.from[0]===d&&y.from[1]===i).length;
        for(const {k,g} of mealIngs(m)){if(S.qty[k]==null)continue;const q=S.qty[k]-g*n;
          if(q<=0){delete S.qty[k];S.pantry[k]='a'}else{S.qty[k]=Math.round(q);if(q<(F[k]&&F[k].u?F[k].u[2]*.75:50))S.pantry[k]='p'}}}if(!m.parts)S.wish=S.wish.filter(x=>x!==m.r);save();if(m.sobra){closeSheet();return}openSheet({type:'cooked',d,i});return}
    case 'undone':day.meals[i].done=false;save();break;
    case 'regen':generatePlan();ui.tab='plano';toast('Plano novo gerado');break;
    case 'addextra':day.extras.push({k:b.dataset.k,g:+b.dataset.g});save();break;
    case 'rmextra':undoable(itemName(day.extras[i].k)+' tirado do dia',()=>day.extras.splice(i,1));break;
    case 'toggle':{const k=b.dataset.k;S.pantry[k]=st(k)==='a'?'t':'a';if(S.pantry[k]==='a')delete S.qty[k];save();break}
    case 'qty':openSheet({type:'qty',k:b.dataset.k});return;
    case 'setqty':{const k=b.dataset.k,g=b.dataset.g?+b.dataset.g:+document.getElementById('qtyg').value;if(!(g>0)){toast('Escolhe uma quantidade');return}
      S.qty[k]=g;if(st(k)==='a')S.pantry[k]='t';delete S.ok[k];save();toast(itemName(k)+': ~'+fmtQ(k,g));closeSheet();return}
    case 'clearqty':delete S.qty[b.dataset.k];save();closeSheet();return;
    case 'okqty':S.ok[b.dataset.k]=+b.dataset.g;save();break;
    case 'low':{const k=b.dataset.k;S.pantry[k]=st(k)==='p'?'t':'p';save();break}
    case 'pf':ui.pf=v;break;
    case 'addcustom':{const n=ui.pq.trim();if(!n)return;const k='c_'+n.toLowerCase().normalize('NFD').replace(/[^a-z0-9]+/g,'_').slice(0,40);S.custom[k]={n,cat:document.getElementById('newcat').value};S.pantry[k]='t';ui.pq='';save();toast(n+' adicionado como “Tenho”');break}
    case 'rmcustom':{const k=b.dataset.k;undoable(itemName(k)+' apagado',()=>{delete S.custom[k];delete S.pantry[k]});break}
    case 'addshop':{const inp=document.getElementById('sq');const n=inp.value.trim();if(!n)return;S.shop.manual.push({n});save();break}
    case 'copyshop':copyShop();return;
    case 'exportar':{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download='favas-contadas-'+todayISO()+'.json';document.body.appendChild(a);a.click();a.remove();toast('Cópia guardada nas transferências');return}
    case 'rf':ui.rf=v;break;
    case 'wish':{if(S.wish.includes(v)){S.wish=S.wish.filter(x=>x!==v);toast('Tirada da lista “quero fazer”')}
      else{S.wish.push(v);ensurePlan();const at=placeWish(v);toast(at?'Posta no plano: '+slotTxt(...at):'Fica na lista: entra no próximo plano')}save();break}
    case 'toplan':{const pd=document.getElementById('pd').value,ii=+document.getElementById('ps').value,r=R[v],[s,sh]=activeSlots()[ii];
      const ds=pd==='all'?S.plan.days.map((x,j)=>j):[+pd];
      for(const dd of ds)replaceMeal(dd,ii,{slot:s,r:v,m:fitMult(r,S.goals.kcal*sh),lock:true,done:false});
      save();ui.day=ds[0];toast(pd==='all'?'Fixada em todos os dias: '+SLOTS[s].toLowerCase():'Posta e fixada no plano: '+slotTxt(ds[0],ii));closeSheet();return}
    case 'custom':ensurePlan();ui.cz={i:Math.min(ui.cz.i,activeSlots().length-1),id:null,days:[],q:''};openSheet({type:'custom'});return;
    case 'czslot':ui.cz.i=+v;ui.cz.days=[];if(!ui.cz.id)ui.cz.q='';break;
    case 'czpick':ui.cz.id=v;break;
    case 'czclear':ui.cz.id=null;break;
    case 'czday':{const c=ui.cz;c.days=c.days.includes(d)?c.days.filter(x=>x!==d):[...c.days,d].sort((a,b)=>a-b);break}
    case 'czall':ui.cz.days=ui.cz.days.length===S.plan.days.length?[]:S.plan.days.map((x,j)=>j);break;
    case 'czapply':{const c=ui.cz,r=R[c.id],[s,sh]=activeSlots()[c.i];if(!r||!c.days.length)return;
      for(const dd of c.days)replaceMeal(dd,c.i,{slot:s,r:c.id,m:fitMult(r,S.goals.kcal*sh),lock:true,done:false});
      save();ui.day=c.days[0];toast(r.n+' fixada: '+SLOTS[s].toLowerCase()+', '+(c.days.length===S.plan.days.length?'todos os dias':c.days.map(dayLabel).join(', ')));
      c.id=null;c.q='';c.days=[];break}
    case 'days':S.goals.days=+v;save();break;
    case 'lanche':S.goals.lanche=v==='1';save();break;
    case 'var':S.goals.variedade=v;save();toast('Carrega em “Gerar plano” para aplicar');break;
    case 'gmode':S.goals.mode=v;syncGoals(S.goals);save();break;
    case 'closesheet':closeSheet();return;
    default:return;
  }
  render();
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.act==='bought'){const k=t.dataset.k;undoable(itemName(k)+' → Tenho',()=>{S.pantry[k]='t';delete S.qty[k];delete S.ok[k]});setTimeout(render,250)}
  if(t.dataset.act==='boughtm'){const i=+t.dataset.i;undoable(S.shop.manual[i].n+' riscado',()=>S.shop.manual.splice(i,1));setTimeout(render,250)}
  if(t.id==='importar'&&t.files&&t.files[0]){t.files[0].text().then(txt=>{const o=JSON.parse(txt);if(!o||typeof o.pantry!=='object')throw 0;
    undoable('Cópia importada',()=>{S=merge(o);ensurePlan()});render()}).catch(()=>toast('Esse ficheiro não é uma cópia do Favas Contadas'));t.value=''}
  if(t.dataset.goal){const n=Math.max(1,Math.round(+t.value||0));setGoal(t.dataset.goal,n);save();render()}
});
document.addEventListener('input',e=>{
  const t=e.target,k=t.dataset.in;if(!k||k==='sq')return;
  if(k==='pq'){ui.pq=t.value;document.getElementById('pres').innerHTML=despensaResults()}
  if(k==='czq'){ui.cz.q=t.value;document.getElementById('czres').innerHTML=customResults()}
  if(k==='rq'){ui.rq=t.value;document.getElementById('rres').innerHTML=receitasResults()}
  if(k==='swapq'&&ui.sheet){ui.swapQ=t.value;document.getElementById('swres').innerHTML=swapResults(ui.sheet.d,ui.sheet.i)}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='sq'){e.preventDefault();document.querySelector('[data-act="addshop"]').click()}
  if(e.key==='Enter'&&e.target.id==='pq'&&document.querySelector('[data-act="addcustom"]')){e.preventDefault();document.querySelector('[data-act="addcustom"]').click()}
  if(e.key==='Escape'&&ui.sheet)closeSheet()});
// botão voltar do Android: fecha a folha aberta ou volta ao separador anterior
window.addEventListener('popstate',e=>{const s=e.state||{};if(ui.sheet&&!s.sheet)ui.sheet=null;
  const t=s.tab||(location.hash||'').slice(1);if(TABN[t])ui.tab=t;render()});
function copyShop(){
  const sl=shoppingList();
  const lines=[...sl.plan.map(x=>`- ${itemName(x.k)} (${fmtQ(x.k,x.g)})`),...sl.low.map(x=>`- ${itemName(x.k)}`),...S.shop.manual.map(x=>'- '+x.n)];
  const txt='Compras\n'+lines.join('\n');
  if(navigator.share){navigator.share({title:'Compras',text:txt}).catch(()=>{});return}
  try{navigator.clipboard.writeText(txt).then(()=>toast('Lista copiada'),()=>toast('Não deu para copiar'))}catch(_){toast('Não deu para copiar')}
}

// ---------- Arranque
(function(){
  const t=(location.hash||'').slice(1);if(TABN[t])ui.tab=t;
  const saved=lsGet();if(saved)S=merge(saved);
  if(!S.goals.mode)S.goals.mode='g';
  syncGoals(S.goals);
  try{history.replaceState({tab:ui.tab},'')}catch(_){}
  ensurePlan();render();
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
</html>
