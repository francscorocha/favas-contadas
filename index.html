<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F2F3EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131613" media="(prefers-color-scheme: dark)">
<title>Despensa</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: app de telemóvel — cabeçalho fixo, conteúdo numa coluna estreita, barra de separadores em baixo */
:root{
  --bg:#F2F3EE; --surface:#FFFFFF; --ink:#1D221E; --muted:#5D655D; --line:#DADDD3;
  --accent:#7A2550; --accent-soft:#F3E3EB; --on-accent:#FFFFFF;
  --ok:#2E7A4B; --ok-soft:#E0EFE5; --warn:#9A6210; --warn-soft:#F6EAD2; --no:#8E948C; --no-soft:#ECEDE8;
  --mp:#7A2550; --mc:#C08418; --mf:#2F7488;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131613; --surface:#1C201C; --ink:#E8ECE5; --muted:#A1A89E; --line:#2E342E;
  --accent:#E583B1; --accent-soft:#3A2230; --on-accent:#1A0E14;
  --ok:#72C590; --ok-soft:#1E3326; --warn:#E3AA4C; --warn-soft:#3A2E17; --no:#737970; --no-soft:#262A25;
  --mp:#E583B1; --mc:#E2B254; --mf:#72B9CC; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131613; --surface:#1C201C; --ink:#E8ECE5; --muted:#A1A89E; --line:#2E342E;
  --accent:#E583B1; --accent-soft:#3A2230; --on-accent:#1A0E14;
  --ok:#72C590; --ok-soft:#1E3326; --warn:#E3AA4C; --warn-soft:#3A2E17; --no:#737970; --no-soft:#262A25;
  --mp:#E583B1; --mc:#E2B254; --mf:#72B9CC; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 24px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{padding-block:12px 10px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:-.02em;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-weight:600;font-size:19px;margin:0;text-wrap:balance}
h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0;font-weight:700}
.sync{font-size:12px;color:var(--muted)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.between{justify-content:space-between}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 16px;font-weight:700;font-size:14px;min-height:44px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 13px;font-size:13.5px;min-height:40px}
input[type=text],input[type=number],input[type=search],select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;width:100%}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:13.5px;min-height:38px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* separadores em baixo */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{border:0;background:none;padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;color:var(--muted);font-weight:700}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--accent)}
nav.tabs .badge{font-family:var(--mono);font-size:10px;background:var(--accent);color:var(--on-accent);border-radius:999px;padding:0 5px;margin-left:2px}

/* macros */
.macros{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.mac{display:flex;flex-direction:column;gap:4px;min-width:0}
.mac .lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.mac .val{font-family:var(--mono);font-size:14px;white-space:nowrap}
.bar{height:6px;border-radius:3px;background:var(--no-soft);overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:3px}
.bar.over i{opacity:.55}
.mline{font-family:var(--mono);font-size:12.5px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.mline b{font-weight:500;color:var(--ink)}
.dp{color:var(--mp)}.dc{color:var(--mc)}.df{color:var(--mf)}

/* plano */
.daytabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.daytabs .chip{white-space:nowrap}
.meal{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.meal:first-child{border-top:0;padding-top:0}
.meal.done{opacity:.55}
.meal .slot{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700}
.meal .name{font-family:var(--display);font-weight:600;font-size:17px;line-height:1.2}
.portion{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.portion button{border:0;background:none;width:44px;height:40px;font-weight:700;font-size:17px}
.portion span{font-family:var(--mono);font-size:13px;min-width:44px;text-align:center}
.miss{font-size:13px;color:var(--warn)}
.tip{font-size:13px;color:var(--muted);border-left:3px solid var(--mc);padding-left:8px}
.alts{display:flex;flex-direction:column;gap:4px;background:var(--bg);border-radius:10px;padding:8px}
.alt{display:flex;justify-content:space-between;gap:8px;align-items:center;border:0;background:none;text-align:left;padding:7px 6px;border-radius:8px}
.alt:hover{background:var(--surface)}
.alt .an{font-weight:700;min-width:0}
.cov{font-family:var(--mono);font-size:12px;border-radius:999px;padding:1px 8px;white-space:nowrap}
.cov.hi{background:var(--ok-soft);color:var(--ok)}.cov.md{background:var(--warn-soft);color:var(--warn)}.cov.lo{background:var(--no-soft);color:var(--muted)}
.layers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px}
.lay{display:flex;justify-content:space-between;gap:6px;font-size:13.5px;align-items:center;min-width:0}
.lay .dots{display:flex;gap:3px;flex:none}
.lay .dots i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--ok)}
.lay .dots i.f{background:var(--ok)}
.lay .dots i.h{background:linear-gradient(90deg,var(--ok) 50%,transparent 50%)}
.sug{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px dashed var(--line)}
.sug:first-of-type{border-top:0}
.extra{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px}
.x{border:0;background:none;color:var(--muted);font-size:20px;line-height:1;min-width:44px;min-height:44px;margin:-8px -10px -8px 0}

/* despensa */
.pitem{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.pitem:first-child{border-top:0}
.pitem .pn{min-width:0;flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:none}
.seg button{border:0;background:none;padding:0 12px;min-height:44px;font-size:13px;font-weight:700;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on.t{background:var(--ok-soft);color:var(--ok)}
.seg button.on.p{background:var(--warn-soft);color:var(--warn)}
.seg button.on.a{background:var(--no-soft);color:var(--ink)}
.addrow{display:flex;gap:8px}
.addrow input{flex:1;min-width:0}
.hint{background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-size:14px}

/* compras */
.shop{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.shop:first-child{border-top:0}
.shop input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--ok);flex:none}
.shop .sn{font-weight:700}
.shop .sd{font-size:13px;color:var(--muted)}

/* receitas */
.rec{border-top:1px solid var(--line);padding:11px 0}
.rec:first-child{border-top:0}
.rec>button{border:0;background:none;width:100%;text-align:left;padding:0;display:flex;flex-direction:column;gap:4px}
.rec .rn{font-family:var(--display);font-weight:600;font-size:16px}
.ing{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:3px 0}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;vertical-align:0;border:1.5px solid}
.dot.t{background:var(--ok);border-color:var(--ok)}
.dot.p{background:linear-gradient(90deg,var(--warn) 50%,transparent 50%);border-color:var(--warn)}
.dot.a{background:transparent;border-color:var(--no)}

/* folha inferior */
.sheet-bg{position:fixed;inset:0;background:rgb(0 0 0 / .35);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;border-radius:18px 18px 0 0;max-height:85%;overflow:auto;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.goals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.goals label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:4px 6px 4px 16px;border-radius:999px;font-size:14px;z-index:30;display:flex;align-items:center;gap:6px;max-width:calc(100% - 32px)}
.toast:not(:has(button)){padding:10px 16px}
.toast button{border:0;background:none;color:inherit;font-weight:700;text-decoration:underline;min-height:40px;padding:0 10px}
@media (prefers-reduced-motion:no-preference){.meal,.pitem,.shop{transition:opacity .2s}}
html{-webkit-text-size-adjust:100%;color-scheme:light}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
.btn{display:inline-flex;align-items:center;justify-content:center}
</style>
</head>
<body>

<header class="top"><div class="wrap"><h1 id="ttl">Plano</h1><span class="sync" id="sync"></span></div></header>
<main class="wrap" id="app"></main>
<nav class="tabs" aria-label="Secções"><div class="in" id="tabs"></div></nav>
<div id="sheet"></div>
<div id="toast" class="toast" hidden></div>

<script src="dados.js"></script>
<script>
// ---------- Dados: dados.js é gerado pelo build.mjs a partir das notas do Obsidian
const F=window.DADOS.alimentos;
for(const x of Object.values(F))x.k=x.kcal;
const CATS=['Fruta e legumes','Frigorífico','Congelados','Mercearia','Frutos secos e sementes','Molhos e temperos','Outros'];
const R={};
for(const r of window.DADOS.receitas)R[r.id]=r;
const SLOTS={pa:'Pequeno-almoço',al:'Almoço',la:'Lanche',ja:'Jantar'};
const POOL={pa:'pa',al:'ref',la:'la',ja:'ref'};
const LAYER1=[['folhas','Folhas escuras',2],['cruc','Crucíferos',1],['cereais','Cereais integrais',3],['leg','Leguminosas',3],['nozes','Frutos secos e sementes',1],['bagas','Frutos vermelhos',1],['vegetais','Outros vegetais',2],['fruta','Outra fruta',2]];
const LAYER2=[['ferm','Fermentado',1],['omega','Linhaça, chia ou nozes',1]];

// ---------- Estado
const DEFAULT={v:1,ts:0,pantry:{},custom:{},goals:{kcal:2400,p:140,c:300,f:70,lanche:true,days:3},plan:null,shop:{manual:[]}};
let S=structuredClone(DEFAULT);
const ui={tab:'plano',day:0,swap:null,swapQ:'',pq:'',pf:'todos',rq:'',rf:'todas',open:null,sheet:null};

function lsGet(){try{return JSON.parse(localStorage.getItem('despensa')||'null')}catch(e){return null}}
function lsSet(){try{localStorage.setItem('despensa',JSON.stringify(S));return true}catch(e){return false}}
function merge(x){return Object.assign(structuredClone(DEFAULT),x||{},{goals:Object.assign({},DEFAULT.goals,(x||{}).goals),shop:Object.assign({manual:[]},(x||{}).shop)})}
function setSync(t){document.getElementById('sync').textContent=t}

function save(){S.ts=Date.now();setSync(lsSet()?'':'não deu para guardar')}

// ---------- Cálculos
const st=k=>S.pantry[k]||'a';
const haveW=k=>({t:1,p:.7,a:0})[st(k)];
const Z=()=>({kcal:0,p:0,c:0,f:0});
function addFood(acc,k,g){const x=F[k];if(!x)return acc;acc.kcal+=x.k*g/100;acc.p+=x.p*g/100;acc.c+=x.c*g/100;acc.f+=x.f*g/100;return acc}
const _ps={};
function perServing(r){if(_ps[r.id])return _ps[r.id];const a=Z();for(const [k,g] of r.ing)addFood(a,k,g/r.sv);return _ps[r.id]=a}
function mealIngs(m){const r=R[m.r];return r?r.ing.map(([k,g])=>({k,g:g/r.sv*m.m})):[]}
function coverage(r){const xs=r.ing.filter(([k,g])=>g/r.sv>=3);return xs.length?xs.reduce((s,[k])=>s+haveW(k),0)/xs.length:1}
function haveCount(r){const xs=r.ing.filter(([k,g])=>g/r.sv>=3);return [xs.filter(([k])=>st(k)!=='a').length,xs.length]}
function layersOf(ings){
  const L={};for(const [g] of LAYER1)L[g]=0;L.ferm=0;L.omega=0;L.vc=false;L.ac=false;
  for(const {k,g} of ings){const x=F[k];if(!x)continue;
    if(x.g1)L[x.g1]+=g/x.s1; if(x.o)L.omega+=g/x.o; if(x.fe)L.ferm+=g/x.fe;
    if(x.vc&&g>=5)L.vc=true; if(x.ac&&g>=3)L.ac=true;}
  return L;
}
function macrosOf(ings){const a=Z();for(const {k,g} of ings)addFood(a,k,g);return a}
function dayIngs(d){const day=S.plan.days[d];return day.meals.flatMap(mealIngs).concat(day.extras.map(e=>({k:e.k,g:e.g})))}
function activeSlots(){return S.goals.lanche?[['pa',.25],['al',.35],['la',.12],['ja',.28]]:[['pa',.28],['al',.38],['ja',.34]]}
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const q4=x=>Math.round(x*4)/4;

function fitMult(r,kcalT){return Math.min(2.5,Math.max(.5,q4(kcalT/Math.max(perServing(r).kcal,1))))}
function scoreRecipe(r,slot,share,accL,used,day,rand){
  const G=S.goals,ps=perServing(r),m=fitMult(r,G.kcal*share);
  const e=Math.abs(ps.kcal*m-G.kcal*share)/(G.kcal*share)+1.5*Math.abs(ps.p*m-G.p*share)/(G.p*share)+Math.abs(ps.c*m-G.c*share)/(G.c*share)+.7*Math.abs(ps.f*m-G.f*share)/(G.f*share);
  const L=layersOf(mealIngs({r:r.id,m}));let gain=0;
  for(const [g,,t] of LAYER1)gain+=Math.min(L[g],Math.max(0,t-accL[g]))/t;
  for(const [g,,t] of LAYER2)gain+=Math.min(L[g],Math.max(0,t-accL[g]))/t;
  // receitas de várias porções podem repetir (sobras); as de 1 porção devem variar
  let pen=0;if(used.today.has(r.id))pen+=10;if(used.recent.has(r.id))pen+=r.sv>=3?1:2.5;
  return {score:5*coverage(r)-2*e+1.2*gain-pen+rand*.9,m};
}
function pickFor(d,slotIdx,exclude){
  const day=S.plan.days[d],[slot,share]=activeSlots()[slotIdx];
  const accL=layersOf(day.meals.filter((x,i)=>i!==slotIdx&&x).flatMap(mealIngs));
  const used={today:new Set(day.meals.filter((x,i)=>i!==slotIdx&&x).map(x=>x.r)),recent:new Set()};
  for(let j=Math.max(0,d-2);j<d;j++)S.plan.days[j].meals.forEach(x=>used.recent.add(x.r));
  const rand=rng(S.plan.seed+d*977+slotIdx*31);
  return Object.values(R).filter(r=>r.slots.includes(POOL[slot])&&r.id!==exclude)
    .map(r=>({r,...scoreRecipe(r,slot,share,accL,used,day,rand())})).sort((a,b)=>b.score-a.score);
}
function buildDay(d){
  const day={meals:[],extras:[]};S.plan.days[d]=day;
  activeSlots().forEach(([slot],i)=>{const best=pickFor(d,i)[0];day.meals[i]={slot,r:best.r.id,m:best.m,done:false}});
}
function generatePlan(persist=true){
  S.plan={seed:Math.floor(Math.random()*1e9),start:todayISO(),lanche:S.goals.lanche,days:[]};
  for(let d=0;d<S.goals.days;d++)buildDay(d);
  ui.day=0;ui.swap=null;if(persist)save();
}
// sem gravar: um plano criado só para mostrar algo não deve passar à frente do estado guardado noutro aparelho
function ensurePlan(){if(!S.plan||!S.plan.days||!S.plan.days.length||S.plan.lanche!==S.goals.lanche||S.plan.days.some(d=>d.meals.some(m=>!R[m.r])))generatePlan(false)}
function todayISO(){const t=new Date();return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0')}
function dayLabel(d){const [y,mo,da]=S.plan.start.split('-').map(Number);const t=new Date(y,mo-1,da+d);
  const wd=['dom','seg','ter','qua','qui','sex','sáb'][t.getDay()];return (d===0&&S.plan.start===todayISO()?'Hoje':wd.charAt(0).toUpperCase()+wd.slice(1))+' '+t.getDate()}

const PROT=[['proteina',30,40],['tofu',126,200],['seitan',100,200],['edamame',100,200],['tempeh',88,150],['iog_proteico',150,250],['soja_tex',25,50]];
function suggestions(d){
  const ings=dayIngs(d),M=macrosOf(ings),L=layersOf(ings),out=[],G=S.goals;
  const dp=G.p-M.p;
  if(dp>12){
    const opts=PROT.map(([k,sv,cap])=>({k,g:Math.min(cap,Math.max(sv/2,Math.round(dp/(F[k].p/100)/5)*5)),w:haveW(k)})).sort((a,b)=>b.w-a.w||F[b.k].p/F[b.k].k-F[a.k].p/F[a.k].k);
    const o=opts[0];out.push({k:o.k,g:o.g,why:`faltam ${Math.round(dp)} g de proteína`});
  }
  for(const [g,label,t] of [...LAYER1,...LAYER2]){
    const miss=t-L[g];if(miss<.5)continue;
    const cands=Object.entries(F).filter(([k,x])=>g==='omega'?x.o:g==='ferm'?x.fe:x.g1===g)
      .map(([k,x])=>({k,w:haveW(k),sv:g==='omega'?x.o:g==='ferm'?x.fe:x.s1})).sort((a,b)=>b.w-a.w);
    const c=cands[0];if(!c)continue;
    const n=Math.max(1,Math.round(miss));
    out.push({k:c.k,g:Math.round(c.sv*n),why:`${label}: ${fmtN(L[g])} de ${t}`});
  }
  return out;
}
const fmtN=x=>{const r=Math.round(x*2)/2;return String(r).replace('.',',')};
const fmtG=g=>g>=1000?(Math.round(g/100)/10+' kg').replace('.',','):(g<10?Math.round(g):Math.round(g/5)*5)+' g';

// ---------- Lista de compras
function shoppingList(){
  const need={};
  if(S.plan)S.plan.days.forEach((day,d)=>{
    day.meals.forEach(m=>{if(m.done)return;for(const {k,g} of mealIngs(m)){if(st(k)==='t')continue;(need[k]||(need[k]={g:0,why:new Set()})).g+=g;need[k].why.add(R[m.r].n)}});
    day.extras.forEach(e=>{if(st(e.k)==='t')return;(need[e.k]||(need[e.k]={g:0,why:new Set()})).g+=e.g;need[e.k].why.add('extra')});
  });
  const plan=[],low=[];
  for(const [k,v] of Object.entries(need)){(st(k)==='p'?low:plan).push({k,g:v.g,why:[...v.why]})}
  for(const k of Object.keys(S.pantry))if(st(k)==='p'&&!need[k])low.push({k,g:0,why:[]});
  for(const k of Object.keys(S.custom))if(st(k)==='p'&&!low.find(x=>x.k===k))low.push({k,g:0,why:[]});
  const byCat=(a,b)=>CATS.indexOf(itemCat(a.k))-CATS.indexOf(itemCat(b.k))||itemName(a.k).localeCompare(itemName(b.k),'pt');
  return {plan:plan.sort(byCat),low:low.sort(byCat)};
}
const itemName=k=>F[k]?F[k].n:(S.custom[k]?S.custom[k].n:k);
const itemCat=k=>F[k]?F[k].cat:(S.custom[k]?S.custom[k].cat:'Outros');

// ---------- Desenho
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
const ICONS={
plano:'<svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>',
despensa:'<svg viewBox="0 0 24 24"><path d="M7 4h10v3H7z"/><path d="M6 7h12v12a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2z"/><path d="M9 13h6"/></svg>',
compras:'<svg viewBox="0 0 24 24"><path d="M5 7h14l-1.5 11a2 2 0 0 1-2 1.7h-7a2 2 0 0 1-2-1.7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>',
receitas:'<svg viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/></svg>',
objetivos:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r=".6"/></svg>'};
const TABN={plano:'Plano',despensa:'Despensa',compras:'Compras',receitas:'Receitas',objetivos:'Objetivos'};

function render(){
  document.getElementById('ttl').textContent=TABN[ui.tab];
  const sl=shoppingList(),n=sl.plan.length+sl.low.length+S.shop.manual.length;
  document.getElementById('tabs').innerHTML=Object.keys(TABN).map(t=>`<button data-act="tab" data-v="${t}" ${ui.tab===t?'aria-current="page"':''}>${ICONS[t]}<span>${TABN[t]}${t==='compras'&&n?`<span class="badge">${n}</span>`:''}</span></button>`).join('');
  const app=document.getElementById('app');
  app.innerHTML=({plano:vPlano,despensa:vDespensa,compras:()=>vCompras(sl),receitas:vReceitas,objetivos:vObjetivos})[ui.tab]();
  renderSheet();
}
function macroBars(M,G){
  const rows=[['kcal','Kcal',M.kcal,G.kcal,'var(--ink)',''],['p','Prot.',M.p,G.p,'var(--mp)','g'],['c','Hidr.',M.c,G.c,'var(--mc)','g'],['f','Gord.',M.f,G.f,'var(--mf)','g']];
  return `<div class="macros">${rows.map(([k,l,v,t,col,u])=>`<div class="mac"><span class="lbl">${l}</span><span class="val">${Math.round(v)}<span class="muted">/${t}${u}</span></span><div class="bar ${v>t*1.1?'over':''}"><i style="width:${Math.min(100,v/t*100)}%;background:${col}"></i></div></div>`).join('')}</div>`;
}
const mline=M=>`<div class="mline"><span><b>${Math.round(M.kcal)}</b> kcal</span><span class="dp"><b>${Math.round(M.p)}</b> P</span><span class="dc"><b>${Math.round(M.c)}</b> H</span><span class="df"><b>${Math.round(M.f)}</b> G</span></div>`;
function covBadge(r){const [h,t]=haveCount(r),c=coverage(r);return `<span class="cov ${c>=.85?'hi':c>=.5?'md':'lo'}">tens ${h}/${t}</span>`}
function dots(v,t){let s='';for(let i=0;i<t;i++){const x=v-i;s+=`<i class="${x>=.75?'f':x>=.25?'h':''}"></i>`}return `<span class="dots">${s}</span>`}

function vPlano(){
  ensurePlan();
  const d=Math.min(ui.day,S.plan.days.length-1),day=S.plan.days[d];
  const ings=dayIngs(d),M=macrosOf(ings),L=layersOf(ings),sugs=suggestions(d);
  const empty=!Object.values(S.pantry).some(v=>v!=='a');
  let h=`<div class="stack">`;
  if(empty)h+=`<div class="hint"><b>Primeiro passo:</b> vai à <button class="btn sm" data-act="tab" data-v="despensa">Despensa</button> e marca o que tens em casa. O plano passa a escolher receitas com o que já tens.</div>`;
  h+=`<div class="daytabs">${S.plan.days.map((x,i)=>`<button class="chip" data-act="day" data-v="${i}" aria-pressed="${i===d}">${dayLabel(i)}</button>`).join('')}</div>`;
  h+=`<div class="card">${macroBars(M,S.goals)}</div>`;
  const next=day.meals.findIndex(x=>!x.done);
  h+=`<div class="card">${day.meals.map((m,i)=>mealCard(d,i,m,i===next)).join('')}</div>`;
  h+=`<div class="card stack"><div class="row between"><h3>3 camadas · camada 1</h3></div><div class="layers">${LAYER1.map(([g,l,t])=>`<div class="lay"><span>${l}</span>${dots(L[g],t)}</div>`).join('')}</div>
    <h3>Camada 2</h3><div class="layers">${LAYER2.map(([g,l,t])=>`<div class="lay"><span>${l}</span>${dots(L[g],t)}</div>`).join('')}</div></div>`;
  if(sugs.length||day.extras.length){
    h+=`<div class="card stack"><h3>Para fechar o dia</h3>`;
    if(day.extras.length)h+=`<div class="stack" style="gap:4px">${day.extras.map((e,i)=>`<div class="extra"><span>${esc(itemName(e.k))} <span class="num muted">${fmtG(e.g)}</span></span><button class="x" data-act="rmextra" data-d="${d}" data-i="${i}" aria-label="Remover">×</button></div>`).join('')}</div>`;
    h+=sugs.map(s=>`<div class="sug"><div><b>${esc(F[s.k].n)}</b> <span class="num">${fmtG(s.g)}</span>${st(s.k)==='a'?' <span class="cov lo">comprar</span>':''}<div class="small muted">${esc(s.why)}</div></div><button class="btn sm" data-act="addextra" data-d="${d}" data-k="${s.k}" data-g="${s.g}">Juntar</button></div>`).join('');
    h+=`</div>`;
  }
  h+=`<div class="row between"><span class="small muted">${S.plan.days.length} dia${S.plan.days.length>1?'s':''} · gerado com o que tens agora</span><button class="btn" data-act="regen">Gerar outro plano</button></div>`;
  return h+`</div>`;
}
function mealCard(d,i,m,isNext){
  const r=R[m.r],ings=mealIngs(m),M=macrosOf(ings),L=layersOf(ings);
  const miss=r.ing.filter(([k,g])=>g/r.sv>=3&&st(k)==='a').map(([k])=>F[k].n);
  const tips=[];
  if(L.leg>=.5&&!L.vc)tips.push('Junta vitamina C (limão, pimento cru, laranja) para absorver melhor o ferro.');
  if(L.leg>=.5&&!L.ac)tips.push('Um dente de alho ou um pouco de cebola ajuda a absorver o zinco.');
  const key=d+'-'+i,open=ui.swap===key;
  let h=`<div class="meal ${m.done?'done':''}"><div class="row between"><span class="slot">${SLOTS[m.slot]}</span>${m.done?'<span class="cov hi">feito</span>':''}</div>
  <div class="row between" style="align-items:flex-start;flex-wrap:nowrap"><span class="name">${esc(r.n)}</span>${covBadge(r)}</div>
  ${mline(M)}`;
  if(miss.length)h+=`<div class="miss">Falta: ${esc(miss.join(', '))}</div>`;
  h+=tips.map(t=>`<div class="tip">${t}</div>`).join('');
  h+=`<div class="row"><span class="portion"><button data-act="m-" data-d="${d}" data-i="${i}" aria-label="Menos">−</button><span>×${String(m.m).replace('.',',')}</span><button data-act="m+" data-d="${d}" data-i="${i}" aria-label="Mais">+</button></span>
  <button class="btn sm" data-act="swap" data-v="${key}">${open?'Fechar':'Trocar'}</button>
  <button class="btn sm" data-act="see" data-v="${r.id}">Ver</button>
  ${m.done?`<button class="btn sm ghost" data-act="undone" data-d="${d}" data-i="${i}">Desfazer</button>`:`<button class="btn sm${isNext?' primary':''}" data-act="done" data-d="${d}" data-i="${i}">Fiz isto</button>`}</div>`;
  if(open)h+=`<div class="alts"><input type="search" id="swapq" placeholder="Procurar outra receita…" value="${esc(ui.swapQ)}" data-in="swapq"><div id="swres">${swapResults(d,i)}</div></div>`;
  return h+`</div>`;
}
function swapResults(d,i){
  const m=S.plan.days[d].meals[i],list=pickFor(d,i,m.r),q=ui.swapQ.trim().toLowerCase();
  const shown=(q?list.filter(x=>x.r.n.toLowerCase().includes(q)):list).slice(0,q?20:6);
  return shown.map(x=>{const M2=macrosOf(mealIngs({r:x.r.id,m:x.m}));return `<button class="alt" data-act="pick" data-d="${d}" data-i="${i}" data-r="${x.r.id}" data-m="${x.m}"><span style="min-width:0"><span class="an">${esc(x.r.n)}</span>${mline(M2)}</span>${covBadge(x.r)}</button>`}).join('')||'<span class="small muted">Nenhuma receita com esse nome para esta refeição.</span>';
}

// a caixa de pesquisa fica fora do bloco que se redesenha, para o teclado não piscar
function vDespensa(){
  return `<div class="stack"><div class="addrow"><input type="search" id="pq" placeholder="Procurar ou adicionar (ex.: tofu)" value="${esc(ui.pq)}" data-in="pq" autocomplete="off"></div><div id="pres" class="stack">${despensaResults()}</div></div>`;
}
function despensaResults(){
  const q=ui.pq.trim().toLowerCase();
  const keys=[...Object.keys(F),...Object.keys(S.custom)];
  const f=ui.pf;
  const list=keys.filter(k=>(!q||itemName(k).toLowerCase().includes(q))&&(f==='todos'||st(k)===f));
  const exact=keys.some(k=>itemName(k).toLowerCase()===q);
  const nT=keys.filter(k=>st(k)==='t').length,nP=keys.filter(k=>st(k)==='p').length;
  let h='';
  if(q&&!exact)h+=`<div class="card row between"><span>Não está na lista. Adicionar <b>${esc(ui.pq.trim())}</b>?</span><span class="row"><select id="newcat" aria-label="Secção">${CATS.map(c=>`<option ${c==='Outros'?'selected':''}>${c}</option>`).join('')}</select><button class="btn primary" data-act="addcustom">Adicionar</button></span></div>`;
  h+=`<div class="chips">${[['todos','Tudo'],['t',`Tenho · ${nT}`],['p',`Pouco · ${nP}`],['a','Acabou']].map(([v,l])=>`<button class="chip" data-act="pf" data-v="${v}" aria-pressed="${f===v}">${l}</button>`).join('')}</div>`;
  if(!nT&&!q)h+=`<div class="hint">Toca em <b>Tenho</b> no que está em casa. Não precisas de pesar nada: quando algo estiver quase no fim, marca <b>Pouco</b> e entra na lista de compras. Sal, especiarias e água contam sempre como “tenho”.</div>`;
  for(const c of CATS){
    const ks=list.filter(k=>itemCat(k)===c).sort((a,b)=>itemName(a).localeCompare(itemName(b),'pt'));
    if(!ks.length)continue;
    h+=`<div class="card"><h3 style="margin-bottom:6px">${c}</h3>${ks.map(k=>`<div class="pitem"><span class="pn">${esc(itemName(k))}${S.custom[k]?` <button class="x" data-act="rmcustom" data-k="${k}" aria-label="Apagar ${esc(itemName(k))}">×</button>`:''}</span>${seg(k)}</div>`).join('')}</div>`;
  }
  if(!list.length&&!q)h+=`<p class="muted">Nada nesta vista.</p>`;
  return h;
}
function seg(k){const s=st(k);return `<span class="seg" role="group" aria-label="${esc(itemName(k))}">${[['t','Tenho'],['p','Pouco'],['a','Acabou']].map(([v,l])=>`<button class="${v}${s===v?' on':''}" data-act="set" data-k="${k}" data-v="${v}" aria-pressed="${s===v}">${l}</button>`).join('')}</span>`}

function vCompras(sl){
  let h=`<div class="stack"><div class="addrow"><input type="text" id="sq" placeholder="Juntar à lista (ex.: papel de cozinha)" data-in="sq" autocomplete="off"><button class="btn primary" data-act="addshop">Juntar</button></div>`;
  const row=(k,detail)=>`<label class="shop"><input type="checkbox" data-act="bought" data-k="${k}"><span><span class="sn">${esc(itemName(k))}</span><div class="sd">${detail}</div></span></label>`;
  if(sl.plan.length)h+=`<div class="card"><h3 style="margin-bottom:4px">Para o plano</h3>${sl.plan.map(x=>row(x.k,`<span class="num">${fmtG(x.g)}</span> · ${esc(x.why.slice(0,3).join(', '))}${x.why.length>3?'…':''}`)).join('')}</div>`;
  if(sl.low.length)h+=`<div class="card"><h3 style="margin-bottom:4px">A acabar</h3>${sl.low.map(x=>row(x.k,x.g?`<span class="num">${fmtG(x.g)}</span> no plano · ${esc(x.why.slice(0,2).join(', '))}`:'repor')).join('')}</div>`;
  if(S.shop.manual.length)h+=`<div class="card"><h3 style="margin-bottom:4px">Outras coisas</h3>${S.shop.manual.map((x,i)=>`<label class="shop"><input type="checkbox" data-act="boughtm" data-i="${i}"><span class="sn">${esc(x.n)}</span></label>`).join('')}</div>`;
  if(!sl.plan.length&&!sl.low.length&&!S.shop.manual.length)h+=`<p class="muted">Tens tudo o que o plano pede. Itens marcados como “Pouco” na despensa também aparecem aqui.</p>`;
  else h+=`<div class="row between"><span class="small muted">Ao riscar, o item passa a “Tenho” na despensa.</span><button class="btn" data-act="copyshop">Copiar lista</button></div>`;
  return h+`</div>`;
}

function vReceitas(){
  return `<div class="stack"><input type="search" id="rq" placeholder="Procurar receita ou ingrediente" value="${esc(ui.rq)}" data-in="rq"><div id="rres" class="stack">${receitasResults()}</div></div>`;
}
function receitasResults(){
  const q=ui.rq.trim().toLowerCase(),f=ui.rf;
  const list=Object.values(R).filter(r=>(!q||r.n.toLowerCase().includes(q)||r.ing.some(([k])=>F[k].n.toLowerCase().includes(q)))&&(f==='todas'||r.slots.includes(f))).sort((a,b)=>coverage(b)-coverage(a)||a.n.localeCompare(b.n,'pt'));
  let h=`<div class="chips">${[['todas','Todas'],['pa','Pequeno-almoço'],['ref','Refeições'],['la','Lanches']].map(([v,l])=>`<button class="chip" data-act="rf" data-v="${v}" aria-pressed="${f===v}">${l}</button>`).join('')}</div><div class="card">`;
  h+=list.map(r=>{const open=ui.open===r.id;return `<div class="rec" id="rec-${r.id}"><button data-act="open" data-v="${r.id}" aria-expanded="${open}"><span class="row between" style="flex-wrap:nowrap;align-items:flex-start"><span class="rn">${esc(r.n)}</span>${covBadge(r)}</span>${mline(perServing(r))}<span class="small muted">por porção · a receita dá ${r.sv}${r.est?' · <span class="cov md">estimada</span>':''}</span></button>${open?recDetail(r):''}</div>`}).join('')||'<p class="muted">Nenhuma receita encontrada.</p>';
  return h+`</div>`;

function recDetail(r){
  const days=S.plan?S.plan.days.map((x,i)=>`<option value="${i}">${dayLabel(i)}</option>`).join(''):'';
  const slots=activeSlots().map(([s],i)=>({s,i})).filter(({s})=>r.slots.includes(POOL[s]));
  const url='obsidian://open?vault='+encodeURIComponent('Obsidian Vault')+'&file='+encodeURIComponent('02 - Recursos/Receitas/'+r.file);
  return `<div class="stack" style="margin-top:10px"><div>${r.ing.map(([k,g])=>`<div class="ing"><span><span class="dot ${st(k)}"></span>${esc(F[k].n)}</span><span class="num muted">${fmtG(g/r.sv)}</span></div>`).join('')}</div>
  <div class="small muted">${r.est?'Esta nota não tem a propriedade despensa, por isso as quantidades foram tiradas da lista de ingredientes e podem falhar.':'Quantidades por porção, da propriedade despensa da nota.'} Sal, especiarias e água não contam.</div>
  ${slots.length&&days?`<div class="row"><select id="pd-${r.id}" aria-label="Dia" style="width:auto">${days}</select><select id="ps-${r.id}" aria-label="Refeição" style="width:auto">${slots.map(({s,i})=>`<option value="${i}">${SLOTS[s]}</option>`).join('')}</select><button class="btn primary sm" data-act="toplan" data-v="${r.id}">Pôr no plano</button></div>`:''}
  <div class="small">Instruções na nota: <a href="${url}">abrir no Obsidian</a> <span class="muted">(${esc(r.file.split('/').pop())})</span></div></div>`;
}

function renderSheet(){
  const el=document.getElementById('sheet');
  if(!ui.sheet){el.innerHTML='';return}
  const {d,i}=ui.sheet,m=S.plan.days[d].meals[i],r=R[m.r];

  el.innerHTML=`<div class="sheet-bg" data-act="closesheet"><div class="sheet stack" role="dialog" aria-label="Depois de cozinhar">
  <h2>Depois de cozinhar: ${esc(r.n)}</h2><p class="small muted" style="margin:0">Marca só o que acabou ou ficou com pouco. Vai direto para as compras.</p>
  <div>${ks.map(k=>`<div class="pitem"><span class="pn">${esc(F[k].n)}</span>${seg(k)}</div>`).join('')}</div>
  <button class="btn primary" data-act="closesheet">Feito</button></div></div>`;
}
// riscar e apagar são imediatos; o aviso dá 5 s para anular
let undoSnap=null;
function undoable(msg,fn){undoSnap=JSON.stringify(S);fn();save();toast(msg,true)}
function toast(t,undo){const el=document.getElementById('toast');el.innerHTML=`<span>${esc(t)}</span>${undo?'<button data-act="undo">Anular</button>':''}`;el.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>{el.hidden=true;if(undo)undoSnap=null},undo?5000:1800)}
function closeSheet(){if(history.state&&history.state.sheet){history.back()}else{ui.sheet=null;render()}}

// ---------- Ações
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,v=b.dataset.v,d=+b.dataset.d,i=+b.dataset.i;
  if(a==='closesheet'&&b.classList.contains('sheet-bg')&&e.target!==b)return;
  if(a==='bought'||a==='boughtm')return;
  const day=S.plan&&S.plan.days[d];
  switch(a){
    case 'tab':if(ui.tab!==v){try{history.pushState({tab:v},'','#'+v)}catch(_){}}ui.tab=v;ui.sheet=null;window.scrollTo(0,0);break;
    case 'undo':if(undoSnap){S=merge(JSON.parse(undoSnap));undoSnap=null;save();document.getElementById('toast').hidden=true}break;
    case 'day':ui.day=+v;ui.swap=null;break;
    case 'swap':ui.swap=ui.swap===v?null:v;ui.swapQ='';break;
    case 'pick':day.meals[i]={...day.meals[i],r:b.dataset.r,m:+b.dataset.m,done:false};ui.swap=null;save();break;
    case 'm-':day.meals[i].m=Math.max(.25,day.meals[i].m-.25);save();break;
    case 'm+':day.meals[i].m=Math.min(4,day.meals[i].m+.25);save();break;
    case 'done':day.meals[i].done=true;ui.sheet={d,i};try{history.pushState({tab:ui.tab,sheet:1},'')}catch(_){}save();break;
    case 'undone':day.meals[i].done=false;save();break;
    case 'see':try{history.pushState({tab:'receitas'},'','#receitas')}catch(_){}ui.tab='receitas';ui.open=v;ui.rq='';ui.rf='todas';render();document.getElementById('rec-'+v)?.scrollIntoView({block:'start'});return;
    case 'regen':generatePlan();ui.tab='plano';toast('Plano novo gerado');break;
    case 'addextra':day.extras.push({k:b.dataset.k,g:+b.dataset.g});save();break;
    case 'rmextra':undoable(itemName(day.extras[i].k)+' tirado do dia',()=>day.extras.splice(i,1));break;
    case 'set':S.pantry[b.dataset.k]=v;save();break;
    case 'pf':ui.pf=v;break;
    case 'addcustom':{const n=ui.pq.trim();if(!n)return;const k='c_'+n.toLowerCase().normalize('NFD').replace(/[^a-z0-9]+/g,'_').slice(0,40);S.custom[k]={n,cat:document.getElementById('newcat').value};S.pantry[k]='t';ui.pq='';save();toast(n+' adicionado como “Tenho”');break}
    case 'rmcustom':{const k=b.dataset.k;undoable(itemName(k)+' apagado',()=>{delete S.custom[k];delete S.pantry[k]});break}
    case 'addshop':{const inp=document.getElementById('sq');const n=inp.value.trim();if(!n)return;S.shop.manual.push({n});save();break}
    case 'copyshop':copyShop();return;
    case 'exportar':{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download='despensa-'+todayISO()+'.json';document.body.appendChild(a);a.click();a.remove();toast('Cópia guardada nas transferências');return}
    case 'rf':ui.rf=v;break;
    case 'open':ui.open=ui.open===v?null:v;break;
    case 'toplan':{const dd=+document.getElementById('pd-'+v).value,ii=+document.getElementById('ps-'+v).value;const r=R[v];S.plan.days[dd].meals[ii]={slot:activeSlots()[ii][0],r:v,m:fitMult(r,S.goals.kcal*activeSlots()[ii][1]),done:false};save();ui.day=dd;toast('Posto no plano');break}
    case 'days':S.goals.days=+v;save();break;
    case 'lanche':S.goals.lanche=v==='1';save();break;
    case 'closesheet':closeSheet();return;
    default:return;
  }
  render();
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.act==='bought'){const k=t.dataset.k;undoable(itemName(k)+' → Tenho',()=>{S.pantry[k]='t'});setTimeout(render,250)}
  if(t.dataset.act==='boughtm'){const i=+t.dataset.i;undoable(S.shop.manual[i].n+' riscado',()=>S.shop.manual.splice(i,1));setTimeout(render,250)}
  if(t.id==='importar'&&t.files&&t.files[0]){t.files[0].text().then(txt=>{const o=JSON.parse(txt);if(!o||typeof o.pantry!=='object')throw 0;
    undoable('Cópia importada',()=>{S=merge(o);ensurePlan()});render()}).catch(()=>toast('Esse ficheiro não é uma cópia da Despensa'));t.value=''}
  if(t.dataset.goal){const n=Math.max(1,Math.round(+t.value||0));S.goals[t.dataset.goal]=n;save();render()}
});
document.addEventListener('input',e=>{
  const t=e.target,k=t.dataset.in;if(!k||k==='sq')return;
  if(k==='pq'){ui.pq=t.value;document.getElementById('pres').innerHTML=despensaResults()}
  if(k==='rq'){ui.rq=t.value;document.getElementById('rres').innerHTML=receitasResults()}
  if(k==='swapq'){ui.swapQ=t.value;const [d,i]=ui.swap.split('-').map(Number);document.getElementById('swres').innerHTML=swapResults(d,i)}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='sq'){e.preventDefault();document.querySelector('[data-act="addshop"]').click()}
  if(e.key==='Enter'&&e.target.id==='pq'&&document.querySelector('[data-act="addcustom"]')){e.preventDefault();document.querySelector('[data-act="addcustom"]').click()}
  if(e.key==='Escape'&&ui.sheet)closeSheet()});
// botão voltar do Android: fecha a folha aberta ou volta ao separador anterior
window.addEventListener('popstate',e=>{const s=e.state||{};if(ui.sheet&&!s.sheet)ui.sheet=null;
  const t=s.tab||(location.hash||'').slice(1);if(TABN[t])ui.tab=t;render()});
function copyShop(){
  const sl=shoppingList();
  const lines=[...sl.plan.map(x=>`- ${itemName(x.k)} (${fmtG(x.g)})`),...sl.low.map(x=>`- ${itemName(x.k)}`),...S.shop.manual.map(x=>'- '+x.n)];
  const txt='Compras\n'+lines.join('\n');
  try{navigator.clipboard.writeText(txt).then(()=>toast('Lista copiada'),()=>toast('Não deu para copiar'))}catch(_){toast('Não deu para copiar')}
}

// ---------- Arranque
(function(){
  const t=(location.hash||'').slice(1);if(TABN[t])ui.tab=t;
  const saved=lsGet();if(saved)S=merge(saved);
  try{history.replaceState({tab:ui.tab},'')}catch(_){}
  ensurePlan();render();
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
</html>
